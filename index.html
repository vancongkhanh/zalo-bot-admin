// ---------- Màn: Câu chưa trả lời ----------
/** Nhóm cho phép, nhãn nhóm và các ask còn chờ (theo unanswered id) cho tab Câu chưa trả lời. */
const reply = { labels: {}, allowed: [], asksByU: new Map(), error: null };

async function loadReplyContext() {
  const [cfg, asksSnap] = await Promise.all([
    getDoc(doc(db, "config", "main")).catch(() => null),
    // Một truy vấn cho mọi thẻ. Lỗi (Rules/chỉ mục chưa triển khai) thì vẫn hiện tab như cũ.
    getDocs(query(collectionGroup(db, "asks"), where("reply_status", "in", ASK_OPEN_STATUSES), limit(1000)))
      .catch((e) => ((reply.error = e), null)),
  ]);
  const raw = cfg?.exists() ? cfg.data() : {};
  reply.labels = raw.chat_labels && typeof raw.chat_labels === "object" ? raw.chat_labels : {};
  reply.allowed = Array.isArray(raw.allowed_chat_ids) ? raw.allowed_chat_ids.filter((x) => typeof x === "string") : [];
  reply.asksByU = new Map();
  if (asksSnap) {
    reply.error = null;
    for (const d of asksSnap.docs) {
      const uid = d.ref.parent.parent?.id;
      if (!uid) continue;
      if (!reply.asksByU.has(uid)) reply.asksByU.set(uid, []);
      reply.asksByU.get(uid).push(askFromDoc(d.id, d.data()));
    }
  }
}

async function renderUnanswered(notice) {
  const [snap, waitingSnap] = await Promise.all([
    getDocs(query(collection(db, "unanswered"), where("status", "==", "new"),
      orderBy("count", "desc"), orderBy("last_asked_at", "desc"), limit(100))),
    // Mục 6.4: câu đã có đáp án nhưng còn người chưa được trả lời.
    getDocs(query(collection(db, "unanswered"), where("status", "==", "answered"), where("pending_ask_count", ">", 0),
      orderBy("pending_ask_count", "desc"), limit(50))).catch((e) => (console.error(e), null)),
    loadKb(),
    loadReplyContext(),
  ]);
  const cards = snap.docs.map((d) => unansweredCard(d.id, d.data()));
  const waiting = (waitingSnap?.docs ?? [])
    .map((d) => ({ id: d.id, u: d.data(), asks: reply.asksByU.get(d.id) ?? [] }))
    .filter((x) => x.asks.length);
  show(
    notice ?? null,
    reply.error ? msg("warn", `Chưa đọc được danh sách người hỏi (${errText(reply.error)}). Các nút cũ vẫn dùng được.`) : null,
    h("p", { class: "muted" },
      `${snap.size} câu đang chờ xử lý${snap.size === 100 ? " (hiện 100 câu hỏi nhiều nhất)" : ""}. `,
      "Câu đã có đáp án sẽ được bot dùng sau tối đa khoảng 1 phút khi mục ở trạng thái Đã duyệt."),
    cards.length ? cards : h("div", { class: "card center muted" }, "Không còn câu nào chưa trả lời."),
    waiting.length
      ? [h("h3", { style: "margin:20px 0 8px;font-size:16px" }, "Đã có đáp án, còn người chưa được trả lời"),
        waiting.map((x) => waitingCard(x.id, x.u, x.asks))]
      : null,
  );
}

/** Dòng "N người hỏi · M nhóm" (mục 6.1). Câu có từ trước khi có tính năng: không có pending_ask_count. */
function askLine(u, asks) {
  if (typeof u.pending_ask_count !== "number") {
    return h("span", { class: "muted", title: "Câu hỏi có từ trước khi lưu người hỏi" }, "Không có thông tin người hỏi");
  }
  const s = askSummary(asks);
  return s.asks ? h("span", { class: "chip" }, `${fmtNum.format(s.people)} người hỏi · ${fmtNum.format(s.chats)} nhóm`) : null;
}

/** Mục 6.4: câu đã duyệt mà còn ask chờ. */
function waitingCard(id, u, asks) {
  const item = u.answered_slug ? state.kb.get(u.answered_slug) : null;
  const samples = (u.samples ?? []).filter((s) => typeof s === "string");
  const n = askSummary(asks).people;
  return h("div", { class: "card" },
    samples.slice(0, 1).map((s) => h("p", { class: "sample" }, `“${s}”`)),
    h("div", { class: "row muted", style: "margin-top:6px" },
      h("span", { class: "chip st-warn" }, `Còn ${fmtNum.format(n)} người chưa được trả lời`),
      askLine(u, asks),
      h("span", {}, `Đáp án: ${item?.title ?? u.answered_slug ?? "-"}`),
      item ? h("span", { class: `chip ${item.status}` }, STATUS_LABELS[item.status] ?? item.status) : null,
    ),
    h("div", { class: "actions" },
      h("button", { class: "btn danger", onclick: () => skipRemaining(id, asks) }, `Bỏ qua ${asks.length} lượt hỏi`),
      h("button", { class: "btn primary", onclick: () => sendOnlyDialog(id, u, asks) }, "Gửi trả lời"),
    ),
  );
}

async function skipRemaining(id, asks) {
  if (!confirm(`Không gửi trả lời cho ${asks.length} lượt hỏi còn lại? Họ sẽ không nhận được tin.`)) return;
  try {
    await skipAsksCall({ unansweredId: id, askIds: asks.map((a) => a.id) });
    await renderUnanswered(msg("ok", emulator ? "Đã bỏ qua (giả lập, emulator không đổi dữ liệu)." : "Đã bỏ qua."));
  } catch (e) {
    alert(fnErrText(e, "skipAsks"));
  }
}

function unansweredCard(id, u) {
  const asks = reply.asksByU.get(id) ?? [];
  const shown = (u.samples ?? []).filter((s) => typeof s === "string");
  // Bỏ tiền tố "[Ảnh] " khi dùng mẫu làm cách hỏi.
  const samples = [...new Set(shown.map(stripImageTag).filter(Boolean))];
  const guess = u.best_guess_slug ? state.kb.get(u.best_guess_slug) : null;
  const isImage = u.source === "image";
  const summary = isImage && typeof u.image_summary === "string" ? u.image_summary : "";
  return h("div", { class: "card" },
    shown.map((s) => h("p", { class: "sample" }, `“${s}”`)),
    summary && !shown.some((s) => s.includes(summary))
      ? h("p", { class: "muted", style: "margin:4px 0 0" }, `Ảnh mới nhất (AI mô tả): ${summary}`)
      : null,
    h("div", { class: "row muted", style: "margin-top:6px" },
      isImage ? h("span", { class: "chip", title: "Người dùng gửi ảnh; ảnh không được lưu" }, "Ảnh") : null,
      h("span", { class: "chip" }, `Hỏi ${fmtNum.format(u.count ?? 0)} lần`),
      askLine(u, asks),
      h("span", {}, `Lần cuối: ${when(u.last_asked_at)}`),
      h("span", {}, `Lý do: ${REASON_LABELS[u.reason] ?? u.reason ?? "-"}`),
    ),
    u.best_guess_slug
      ? h("p", { class: "muted", style: "margin:6px 0 0" },
        `AI đoán gần nhất: ${guess?.title ?? u.best_guess_slug} (${u.best_guess_slug})`,
        typeof u.best_guess_confidence === "number" ? `, độ tin cậy ${u.best_guess_confidence.toFixed(2)}` : "")
      : null,
    h("div", { class: "actions" },
      h("button", { class: "btn danger", onclick: () => ignoreUnanswered(id) }, "Bỏ qua"),
      h("button", { class: "btn", onclick: () => attachDialog(id, u, samples, asks) }, "Gắn vào mục có sẵn"),
      h("button", { class: "btn primary", onclick: () => newFromUnanswered(id, samples, asks) }, "Soạn đáp án mới"),
    ),
  );
}

async function ignoreUnanswered(id) {
  if (!confirm("Bỏ qua câu này? Nếu có người hỏi lại mà bot vẫn chưa trả lời được, câu sẽ hiện lại.")) return;
  try {
    await updateDoc(doc(db, "unanswered", id), { status: "ignored", handled_by: state.user.email });
    await renderUnanswered(msg("ok", "Đã bỏ qua."));
  } catch (e) {
    alert(errText(e));
  }
}

function newFromUnanswered(id, samples, asks = []) {
  const title = (samples[0] ?? "").slice(0, 200);
  const form = { ...itemToForm("", null), slug: suggestSlug(title), title, questions: samples.join("\n") };
  itemEditor({
    slug: null,
    form,
    heading: "Soạn đáp án mới từ câu chưa trả lời",
    unansweredId: id,
    replyAsks: asks,
    onDone: () => renderUnanswered(msg("ok", "Đã lưu mục mới và đánh dấu câu là đã có đáp án.")),
  });
}

// ---------- Khối "Gửi trả lời cho người đã hỏi" (mục 6.2) ----------
/**
 * asks: ask còn chờ của câu. defaultAnswer(): phần gửi đi lấy từ đáp án (theo dõi tới khi người dùng tự sửa).
 * blocked(): lý do chưa gửi được (ví dụ mục chưa Đã duyệt) hoặc null. onChange(): báo form chính cập nhật nút.
 */
function replyBlock({ asks, defaultAnswer, blocked = () => null, onChange = () => {} }) {
  const nowMs = Date.now();
  const rows = groupAsksByChat(asks).flatMap((g) => g.asks).map((a) => {
    const flags = askFlags(a, { nowMs, allowedChatIds: reply.allowed });
    const box = h("input", { type: "checkbox", checked: flags.preselect });
    box.addEventListener("change", () => refresh());
    return { ask: a, flags, box };
  });
  const enable = h("input", { type: "checkbox", checked: rows.length > 0 });
  enable.addEventListener("change", () => refresh());
  const answerInput = h("textarea", { rows: 5 });
  let touched = false;
  answerInput.addEventListener("input", () => {
    touched = true;
    refresh();
  });
  const resetBtn = h("button", { class: "btn", type: "button", onclick: () => ((touched = false), refresh()) },
    "Lấy lại từ đáp án");
  const blockedBox = h("div");
  const previews = h("div");
  const counter = h("div", { class: "count" });
  const body = h("div", {},
    blockedBox,
    h("p", { class: "muted", style: "margin:6px 0" },
      "Tin gửi vào đúng nhóm/chat của từng người hỏi. Mỗi nhóm một tin, chỉ có tên người hỏi trong nhóm đó."),
    rows.map(({ ask, flags, box }) => h("label", { class: "row", style: "margin:6px 0;flex-wrap:nowrap;align-items:flex-start" },
      box,
      h("div", { class: "grow" },
        h("div", { class: "row" },
          h("b", {}, ask.displayName || "(không có tên)"),
          h("span", { class: "chip" }, chatDisplayName(ask.chatId, ask.chatType, reply.labels)),
          h("span", { class: "muted" }, ask.askedAtMs ? fmtTime.format(new Date(ask.askedAtMs)) : ""),
          flags.oldDays !== null ? h("span", { class: "chip st-warn" }, `Đã hỏi ${flags.oldDays} ngày trước`) : null,
          flags.notAllowed ? h("span", { class: "chip st-bad" }, "Nhóm không còn trong cấu hình") : null,
          flags.noChat ? h("span", { class: "chip st-bad" }, "Thiếu mã nhóm, không gửi được") : null,
          ask.status === "failed" ? h("span", { class: "chip st-bad", title: ask.error ?? "" }, "Lần gửi trước lỗi") : null,
        ),
        h("div", { class: "sample muted" }, replyQuote(ask)),
      ),
    )),
    h("label", { class: "f" }, "Nội dung gửi đi",
      h("span", { class: "hint" }, " lấy từ đáp án; sửa ở đây chỉ đổi tin gửi đi, không đổi mục kho")),
    answerInput,
    h("div", { class: "row", style: "justify-content:space-between" }, resetBtn, counter),
    h("label", { class: "f" }, "Xem trước", h("span", { class: "hint" }, " đúng tin sẽ gửi cho từng nhóm")),
    previews,
  );
  const el = rows.length
    ? h("div", { class: "card", style: "margin:12px 0" },
      h("label", { class: "row", style: "font-weight:600" }, enable, "Gửi trả lời cho người đã hỏi"),
      body)
    : null;

  function state_() {
    const answerText = cleanText(answerInput.value);
    const selected = rows.filter((r) => r.box.checked).map((r) => r.ask);
    const plan = replyPlan(selected.filter((a) => a.chatId), answerText);
    const reason = blocked();
    const active = !!el && enable.checked && selected.length > 0 && !reason;
    const valid = active && !!answerText && !plan.over && plan.sendable > 0;
    return { active, valid, answerText, selected, plan, reason };
  }

  function refresh() {
    if (!el) return;
    if (!touched) answerInput.value = defaultAnswer() ?? "";
    body.hidden = !enable.checked;
    const s = state_();
    blockedBox.replaceChildren(...nodes(s.reason ? msg("warn", s.reason) : null));
    counter.textContent = `${fmtNum.format(s.plan.maxLength)}/${fmtNum.format(REPLY_MAX_TEXT)} ký tự (tin dài nhất)`;
    counter.className = s.plan.over ? "count over" : "count";
    previews.replaceChildren(...(s.plan.groups.length
      ? s.plan.groups.map((g) => {
        const where = g.chatType && g.chatType !== "GROUP"
          ? `Chat riêng với ${g.asks[0].displayName || "(không có tên)"}`
          : chatDisplayName(g.chatId, g.chatType, reply.labels);
        return h("div", { style: "margin:8px 0" },
          h("div", { class: "row" }, h("b", {}, `Gửi vào: ${where}`),
            h("span", { class: g.length > REPLY_MAX_TEXT ? "count over" : "count" }, `${fmtNum.format(g.length)} ký tự`)),
          h("div", { class: "quote" }, g.text));
      })
      : [h("p", { class: "muted" }, "Chưa chọn người hỏi nào.")]));
    onChange();
  }

  return { el, refresh, state: state_, hasAsks: rows.length > 0 };
}

/** Gọi sendReplyToAskers và hiện kết quả từng nhóm trong hộp thoại; "Gửi lại" chỉ gửi các nhóm lỗi. */
async function runSend({ unansweredId, answerText, askIds, kbItemId, asks, title, onClose }) {
  const byChat = new Map(asks.map((a) => [a.chatId, a]));
  const close = h("button", { class: "btn", onclick: () => (closeDialog(), onClose?.()) }, "Đóng");
  close.disabled = true;
  const chats = new Set(asks.filter((a) => askIds.includes(a.id)).map((a) => a.chatId ?? a.id)).size;
  const box = h("div", {}, h("p", { class: "muted" }, `Đang gửi vào ${fmtNum.format(chats)} nhóm/chat… Không đóng trang.`));
  openDialog(h("h2", {}, title ?? "Gửi trả lời cho người đã hỏi"), box, h("div", { class: "actions" }, close));
  $dlg.oncancel = (e) => close.disabled && e.preventDefault(); // không cho Esc khi đang gửi
  try {
    const res = await sendReplyCall({ unansweredId, answerText, askIds, kbItemId: kbItemId ?? null });
    const results = res.data?.results ?? [];
    // Nhóm "không rõ đã gửi chưa" không gửi lại tự động (server cũng chặn tới khi quá hạn).
    const retryGroups = results.filter((r) => r.status === "failed" && r.error !== "UNKNOWN_STATE");
    const retryIds = retryGroups.flatMap((r) => r.ask_ids);
    const sent = results.filter((r) => r.status === "sent").length;
    box.replaceChildren(...nodes(
      emulator ? msg("warn", "Emulator: kết quả giả lập, không gửi Zalo, trạng thái người hỏi không đổi.") : null,
      msg(retryIds.length ? "warn" : "ok", `Đã gửi ${sent}/${results.length} nhóm.`),
      results.map((r) => {
        const lab = replyResultLabel(r);
        const a = byChat.get(r.chat_id);
        const where = r.chat_name ?? (a?.chatType && a.chatType !== "GROUP"
          ? `Chat riêng với ${a.displayName || "(không có tên)"}` : chatDisplayName(r.chat_id, a?.chatType, reply.labels));
        return h("div", { class: "row", style: "margin:6px 0;align-items:flex-start;flex-wrap:nowrap" },
          h("span", {}, lab.icon),
          h("div", { class: "grow" },
            h("b", {}, where), h("span", { class: "muted" }, ` · ${r.ask_count} lượt hỏi`),
            h("div", { class: lab.cls === "bad" ? "errs" : "muted", style: "padding:0" }, lab.text)));
      }),
      retryIds.length
        ? h("div", { class: "actions" }, h("button", {
          class: "btn primary",
          onclick: () => runSend({ unansweredId, answerText, askIds: retryIds, kbItemId, asks, title: "Gửi lại các nhóm lỗi", onClose }),
        }, `Gửi lại ${retryGroups.length} nhóm lỗi`))
        : null,
    ));
  } catch (e) {
    console.error(e);
    box.replaceChildren(
      msg("bad", `Chưa gửi được: ${fnErrText(e, "sendReplyToAskers")}`),
      h("div", { class: "actions" }, h("button", {
        class: "btn primary",
        onclick: () => runSend({ unansweredId, answerText, askIds, kbItemId, asks, title, onClose }),
      }, "Thử lại")),
    );
  } finally {
    close.disabled = false;
    $dlg.oncancel = null;
  }
}

/** Mục 6.4: gửi bằng đáp án đã duyệt, không sửa kho. */
function sendOnlyDialog(id, u, asks) {
  const item = u.answered_slug ? state.kb.get(u.answered_slug) : null;
  const sendBtn = h("button", { class: "btn primary" }, "Gửi");
  const errBox = h("div");
  const block = replyBlock({
    asks,
    defaultAnswer: () => defaultReplyAnswer(item),
    blocked: () => !item ? "Mục đáp án không còn trong kho."
      : item.status !== "approved" ? "Mục đáp án chưa ở trạng thái Đã duyệt: duyệt mục trước khi gửi." : null,
    onChange: () => {
      const s = block?.state();
      if (!s) return;
      sendBtn.disabled = !s.valid;
      sendBtn.textContent = s.active ? `Gửi (${s.plan.sendable} nhóm)` : "Gửi";
    },
  });
  sendBtn.addEventListener("click", () => {
    const s = block.state();
    if (!s.valid) return;
    if (!confirm(`Gửi trả lời vào ${s.plan.sendable} nhóm/chat?`)) return;
    sendBtn.disabled = true;
    runSend({ unansweredId: id, answerText: s.answerText, askIds: s.selected.map((a) => a.id), kbItemId: u.answered_slug,
      asks, onClose: () => renderUnanswered() });
  });
  openDialog(
    h("h2", {}, "Gửi trả lời"),
    h("p", { class: "muted" }, `Đáp án: ${item?.title ?? u.answered_slug ?? "-"}`),
    block.el, errBox,
    h("div", { class: "actions" }, h("button", { class: "btn", onclick: closeDialog }, "Hủy"), sendBtn),
  );
  block.refresh();
}

function attachDialog(id, u, samples, asks = []) {
  const entries = [...state.kb.entries()].filter(([, d]) => d.status !== "hidden")
    .sort(([a, x], [b, y]) => (x.title ?? a).localeCompare(y.title ?? b, "vi"));
  if (!entries.length) return alert("Kho chưa có mục nào để gắn.");
  const pick = h("select", {},
    entries.map(([slug, d]) => h("option", { value: slug }, `${d.title ?? slug} (${STATUS_LABELS[d.status] ?? d.status})`)));
  pick.value = u.best_guess_slug && state.kb.has(u.best_guess_slug) ? u.best_guess_slug : entries[0][0];
  const boxes = samples.map((s) => h("input", { type: "checkbox", checked: true }));
  const confirmBox = h("input", { type: "checkbox" });
  const confirmRow = h("label", { class: "row" }, confirmBox,
    "Mục này đang được bot dùng. Tôi xác nhận thêm cách hỏi (bot sẽ dùng mục cho các câu này).");
  const info = h("p", { class: "muted" });
  const errBox = h("div");
  const saveBtn = h("button", { class: "btn primary" }, "Lưu");
  // Mục 6.2: answerText = nội dung mục được chọn; sửa phần gửi đi không đổi mục kho (A10).
  const block = replyBlock({
    asks,
    defaultAnswer: () => defaultReplyAnswer(state.kb.get(pick.value)),
    blocked: () => (state.kb.get(pick.value)?.status !== "approved"
      ? "Chỉ gửi được khi mục được chọn ở trạng thái Đã duyệt." : null),
    onChange: () => {
      const s = block?.state();
      saveBtn.disabled = !!s?.active && !s.valid;
      saveBtn.textContent = s?.active ? `Duyệt & gửi (${s.plan.sendable} nhóm)` : "Lưu";
    },
  });
  const refresh = () => {
    const d = state.kb.get(pick.value);
    confirmRow.hidden = d?.status !== "approved";
    info.textContent = d?.status === "approved"
      ? `Mục đã duyệt, hiện có ${d.questions?.length ?? 0} cách hỏi.`
      : `Mục đang ở trạng thái ${STATUS_LABELS[d?.status] ?? d?.status}: bot chưa dùng cho tới khi bạn duyệt.`;
    block.refresh();
  };
  pick.addEventListener("change", refresh);
  const save = async () => {
    const slug = pick.value;
    const old = state.kb.get(slug);
    const added = samples.filter((_, i) => boxes[i].checked);
    errBox.replaceChildren();
    if (!added.length) return errBox.replaceChildren(msg("bad", "Chọn ít nhất một câu."));
    if (old.status === "approved" && !confirmBox.checked) {
      return errBox.replaceChildren(msg("bad", "Đánh dấu ô xác nhận trước khi lưu mục đã duyệt."));
    }
    const questions = mergeQuestions(old.questions, added);
    if (questions.length > MAX_QUESTIONS) return errBox.replaceChildren(msg("bad", `Mục đã đủ ${MAX_QUESTIONS} cách hỏi.`));
    const send = block.state();
    if (send.active) {
      if (!send.valid) return;
      if (!confirm(`Gửi trả lời vào ${send.plan.sendable} nhóm/chat?`)) return;
    }
    saveBtn.disabled = true;
    try {
      await saveItem(slug, old, { ...pickContent(old), questions, status: old.status }, id);
    } catch (e) {
      errBox.replaceChildren(msg("bad", errText(e)));
      saveBtn.disabled = false;
      return;
    }
    const done = () => renderUnanswered(msg("ok", `Đã gắn vào mục "${old.title ?? slug}".`));
    if (send.active) {
      await runSend({ unansweredId: id, answerText: send.answerText, askIds: send.selected.map((a) => a.id),
        kbItemId: slug, asks, title: "Đã gắn đáp án. Gửi trả lời cho người đã hỏi", onClose: done });
      return;
    }
    closeDialog();
    await done();
  };
  openDialog(
    h("h2", {}, "Gắn vào mục có sẵn"),
    h("p", { class: "muted" }, "Các câu được chọn sẽ thêm vào danh sách cách hỏi của mục."),
    h("label", { class: "f" }, "Mục"),
    pick,
    info,
    h("label", { class: "f" }, "Câu thêm vào"),
    samples.map((s, i) => h("label", { class: "row", style: "margin:4px 0" }, boxes[i], h("span", { class: "sample grow" }, s))),
    confirmRow,
    block.el,
    errBox,
    h("div", { class: "actions" },
      h("button", { class: "btn", onclick: closeDialog }, "Hủy"),
      saveBtn,
    ),
  );
  saveBtn.addEventListener("click", save);
  refresh();
}

function pickContent(d) {
  return {
    title: d.title ?? "",
    topic: d.topic ?? "",
    questions: d.questions ?? [],
    answer: d.answer ?? "",
    links: d.links ?? [],
    keywords: d.keywords ?? [],
    source: d.source ?? "",
    images: normalizeImages(d.images),
  };
}

/**
 * Ghi một mục (tạo hoặc sửa) trong transaction: từ chối nếu mục vừa bị sửa ở nơi khác
 * (version khác lúc mở) hoặc slug mới đã tồn tại. Có `unansweredId` thì đánh dấu câu là đã có đáp án.
 */
async function saveItem(slug, old, item, unansweredId) {
  const email = state.user.email;
  const ref = doc(db, "kb_items", slug);
  await runTransaction(db, async (tx) => {
    const cur = await tx.get(ref);
    if (!old && cur.exists()) throw new Error(`Mã mục "${slug}" vừa được tạo ở nơi khác. Chọn mã khác.`);
    if (old && !cur.exists()) throw new Error("Mục không còn trong kho. Tải lại trang.");
    if (old && cur.data().version !== old.version) {
      throw new Error("Mục vừa được sửa ở nơi khác (script hoặc người khác). Đóng và mở lại để xem bản mới.");
    }
    const data = buildItemWrite(old ? cur.data() : null, item, email, serverTimestamp());
    if (data) {
      if (old) tx.update(ref, data);
      else tx.set(ref, data);
    }
    if (unansweredId) {
      tx.update(doc(db, "unanswered", unansweredId), {
        status: "answered", answered_slug: slug, answered_at: serverTimestamp(), handled_by: email,
      });
    }
  });
}

// ---------- Form sửa mục (dùng chung) ----------
function itemEditor({ slug, form, heading, unansweredId, replyAsks = [], onDone }) {
  const isNew = !slug;
  const old = isNew ? null : state.kb.get(slug);
  const f = { ...form };
  const field = (key, label, hint, el) => {
    el.value = f[key];
    el.addEventListener("input", () => {
      f[key] = el.value;
      check();
    });
    return [h("label", { class: "f" }, label, hint ? h("span", { class: "hint" }, ` ${hint}`) : null), el];
  };
  const slugInput = h("input", { disabled: !isNew, autocomplete: "off" });
  const titleInput = h("input", { autocomplete: "off" });
  // Gợi ý mã mục theo tiêu đề cho tới khi người dùng tự sửa mã (hoặc đã tải ảnh lên).
  let auto = isNew && f.slug === suggestSlug(f.title);
  if (isNew) {
    slugInput.addEventListener("input", () => (auto = false));
    titleInput.addEventListener("input", () => {
      if (auto) {
        f.slug = slugInput.value = suggestSlug(titleInput.value);
      }
    });
  }
  const answerInput = h("textarea", { rows: 8 });
  const counter = h("div", { class: "count" });
  const statusSelect = h("select", {}, STATUSES.map((s) => h("option", { value: s }, STATUS_LABELS[s])));
  // Ô xác nhận đánh dấu sẵn (theo yêu cầu 16/11/2026); bỏ đánh dấu thì không lưu được mục đã duyệt.
  const confirmBox = h("input", { type: "checkbox", checked: true });
  const confirmRow = h("label", { class: "row", style: "margin-top:10px" }, confirmBox,
    "Tôi xác nhận: sau khi lưu, bot sẽ gửi nguyên văn nội dung này cho người hỏi.");
  const errList = h("div");
  const saveBtn = h("button", { class: "btn primary" }, "Lưu");
  const existing = new Set(state.kb.keys());

  // ----- AI gợi ý cách hỏi -----
  const questionsInput = h("textarea", { rows: 5 });
  const suggestBox = h("div");
  const suggestBtn = h("button", { class: "btn", type: "button" }, "Đề xuất cách hỏi bằng AI");
  suggestBtn.addEventListener("click", async () => {
    const payload = suggestPayload(f);
    if (!payload.title) return suggestBox.replaceChildren(msg("bad", "Nhập tiêu đề trước, AI dựa vào tiêu đề để đề xuất."));
    suggestBtn.disabled = true;
    suggestBtn.textContent = "AI đang đề xuất…";
    suggestBox.replaceChildren(h("p", { class: "muted" }, "Thường mất vài giây."));
    try {
      const res = await suggestCall(payload);
      const fresh = (res.data?.questions ?? []).filter((q) => typeof q === "string");
      const shown = fresh.filter((q) => addQuestionsText(f.questions, [q]) !== splitLines(f.questions).join("\n"));
      if (!shown.length) {
        suggestBox.replaceChildren(msg("warn", "AI không có gợi ý mới (các câu gợi ý đã có trong danh sách)."));
        return;
      }
      const boxes = shown.map(() => h("input", { type: "checkbox", checked: true }));
      const addBtn = h("button", { class: "btn primary", type: "button" }, "Thêm các câu đã chọn");
      addBtn.addEventListener("click", () => {
        const picked = shown.filter((_, i) => boxes[i].checked);
        f.questions = questionsInput.value = addQuestionsText(f.questions, picked);
        suggestBox.replaceChildren(msg("ok", `Đã thêm ${picked.length} cách hỏi. Đọc lại và sửa nếu cần trước khi lưu.`));
        check();
      });
      suggestBox.replaceChildren(h("div", { class: "card", style: "margin:8px 0" },
        h("p", { class: "muted", style: "margin-top:0" }, "Gợi ý của AI (bỏ chọn câu không phù hợp):"),
        shown.map((q, i) => h("label", { class: "row", style: "margin:4px 0;flex-wrap:nowrap" },
          boxes[i], h("span", { style: "min-width:0;overflow-wrap:anywhere" }, q))),
        h("div", { class: "actions" },
          h("button", { class: "btn", type: "button", onclick: () => suggestBox.replaceChildren() }, "Bỏ qua"),
          addBtn),
      ));
    } catch (e) {
      console.error(e);
      const text = e?.code === "functions/permission-denied" || e?.code === "functions/unauthenticated"
        ? "Tài khoản chưa có quyền dùng AI đề xuất."
        : e?.code === "functions/not-found" || e?.code === "functions/internal"
          ? "Chưa gọi được hàm suggestQuestions (đã triển khai hàm chưa?)."
          : (e?.message || "AI chưa đề xuất được, thử lại sau.");
      suggestBox.replaceChildren(msg("bad", text));
    } finally {
      suggestBtn.disabled = false;
      suggestBtn.textContent = "Đề xuất cách hỏi bằng AI";
    }
  });

  // ----- Ảnh (bước E) -----
  f.images = normalizeImages(f.images);
  let uploading = 0;
  const imagesBox = h("div");
  const imageNote = h("p", { class: "muted", style: "margin:4px 0" });
  const imageMsg = h("div");
  const fileInput = h("input", { type: "file", accept: "image/jpeg,image/png,image/webp", multiple: true, hidden: true });
  const addImageBtn = h("button", { class: "btn", type: "button", onclick: () => fileInput.click() }, "+ Thêm ảnh");
  fileInput.addEventListener("change", () => {
    const files = [...fileInput.files];
    fileInput.value = "";
    addImages(files);
  });

  const moveImage = (i, d) => {
    const j = i + d;
    if (j < 0 || j >= f.images.length) return;
    [f.images[i], f.images[j]] = [f.images[j], f.images[i]];
    drawImages();
    check();
  };

  function drawImages() {
    const n = f.images.length;
    imagesBox.replaceChildren(...f.images.map((im, i) => {
      const cap = h("input", {
        value: im.caption, autocomplete: "off", class: "grow", maxlength: MAX_CAPTION_CHARS,
        placeholder: `Chú thích (để trống: "Bước ${i + 1}/${n}")`,
      });
      cap.addEventListener("input", () => {
        im.caption = cap.value;
        check();
      });
      return h("div", { class: "imgrow" },
        h("a", { href: im.url, target: "_blank", rel: "noopener noreferrer", title: "Mở ảnh" },
          h("img", { src: im.url, alt: `Ảnh ${i + 1}`, loading: "lazy" })),
        h("div", { class: "grow" },
          h("div", { class: "row" }, h("b", {}, `Ảnh ${i + 1}`),
            h("span", { class: "muted" }, im.width ? `${im.width}×${im.height}, ${Math.round(im.bytes / 1024)} KB` : "")),
          cap),
        h("div", { class: "row", style: "flex-wrap:nowrap" },
          h("button", { class: "btn", type: "button", title: "Lên", disabled: i === 0, onclick: () => moveImage(i, -1) }, "↑"),
          h("button", { class: "btn", type: "button", title: "Xuống", disabled: i === n - 1, onclick: () => moveImage(i, 1) }, "↓"),
          h("button", {
            class: "btn danger", type: "button",
            onclick: () => {
              f.images.splice(i, 1);
              drawImages();
              check();
            },
          }, "Gỡ")),
      );
    }));
    imageNote.textContent = n
      ? `${n}/${MAX_IMAGES} ảnh. ${imageSendNote(n, state.maxImages)} Gỡ ảnh chỉ bỏ khỏi mục, tệp vẫn còn trong Storage.`
      : `Chưa có ảnh. Chọn tệp hoặc dán ảnh chụp màn hình (Ctrl+V) khi đang mở form. Tối đa ${MAX_IMAGES} ảnh.`;
    addImageBtn.disabled = n >= MAX_IMAGES;
  }

  /** Thư mục ảnh theo slug: mục mới phải có slug hợp lệ, chưa trùng, trước khi tải ảnh. */
  function imageSlug() {
    const s = isNew ? cleanText(f.slug) : slug;
    if (!s || !SLUG_PATTERN.test(s) || s.length > 80) return { error: "Nhập mã mục (slug) hợp lệ trước khi thêm ảnh." };
    if (isNew && existing.has(s)) return { error: `Mã mục "${s}" đã có trong kho.` };
    return { slug: s };
  }

  async function addImages(files) {
    imageMsg.replaceChildren();
    const target = imageSlug();
    if (target.error) return imageMsg.replaceChildren(msg("bad", target.error));
    const room = MAX_IMAGES - f.images.length - uploading;
    const problems = [];
    if (files.length > room) problems.push(`Chỉ thêm được ${Math.max(0, room)} ảnh nữa (tối đa ${MAX_IMAGES}).`);
    const accepted = [];
    for (const file of files.slice(0, Math.max(0, room))) {
      const p = imageFileProblem(file);
      if (p) problems.push(`${file.name || "Ảnh dán"}: ${p}`);
      else accepted.push(file);
    }
    if (!accepted.length) return imageMsg.replaceChildren(list("errs", problems));
    if (isNew) {
      // Đường dẫn ảnh theo slug: khóa slug sau khi đã tải ảnh.
      slugInput.disabled = true;
      auto = false;
    }
    uploading += accepted.length;
    check();
    const status = h("p", { class: "muted" }, `Đang xử lý và tải ${accepted.length} ảnh…`);
    imageMsg.replaceChildren(status, list("errs", problems));
    for (const file of accepted) {
      try {
        f.images.push(await uploadImage(target.slug, file));
        drawImages();
      } catch (e) {
        console.error(e);
        problems.push(`${file.name || "Ảnh dán"}: ${errText(e)}`);
      } finally {
        uploading--;
        check();
      }
    }
    imageMsg.replaceChildren(...nodes(problems.length ? list("errs", problems) : null));
  }

  $dlg.onpaste = (e) => {
    const files = [...(e.clipboardData?.files ?? [])].filter((x) => /^image\//.test(x.type));
    if (!files.length) return;
    e.preventDefault();
    addImages(files);
  };

  // ----- Gửi trả lời cho người đã hỏi (mục 6.2, 6.3) -----
  let lastRes = null;
  const block = unansweredId && replyAsks.length
    ? replyBlock({
      asks: replyAsks,
      defaultAnswer: () => defaultReplyAnswer(lastRes?.item ?? { answer: f.answer, links: [] }),
      blocked: () => (f.status !== "approved"
        ? "Chỉ gửi được khi mục lưu ở trạng thái Đã duyệt (chọn ở ô Trạng thái bên trên)." : null),
      onChange: () => updateSaveBtn(),
    })
    : null;

  function updateSaveBtn() {
    const s = block?.state();
    const sending = !!s?.active;
    saveBtn.disabled = !lastRes?.item || uploading > 0 || (sending && !s.valid);
    saveBtn.textContent = uploading > 0 ? "Đang tải ảnh…" : sending ? `Duyệt & gửi (${s.plan.sendable} nhóm)` : "Lưu";
  }

  function check() {
    const len = charLength(cleanText(f.answer));
    counter.textContent = `${len}/${MAX_ANSWER_CHARS} ký tự`;
    counter.className = len > MAX_ANSWER_CHARS ? "count over" : "count";
    const res = validateItemForm(f, { isNew, existingSlugs: existing, localImageUrls: emulator });
    lastRes = res;
    confirmRow.hidden = !(res.item && needsLiveConfirm(old, res.item));
    errList.replaceChildren(...[list("errs", res.errors), list("warns", res.warnings)].filter(Boolean));
    if (block) block.refresh();
    else updateSaveBtn();
    return res;
  }

  saveBtn.addEventListener("click", async () => {
    const res = check();
    if (!res.item || uploading > 0) return;
    if (needsLiveConfirm(old, res.item) && !confirmBox.checked) {
      return errList.replaceChildren(msg("bad", "Đánh dấu ô xác nhận trước khi lưu mục đã duyệt."));
    }
    const send = block?.state();
    if (send?.active) {
      if (!send.valid) return;
      if (!confirm(`Gửi trả lời vào ${send.plan.sendable} nhóm/chat?`)) return;
    }
    if (old && !buildItemWrite(old, res.item, "", null) && !unansweredId) {
      closeDialog();
      return;
    }
    saveBtn.disabled = true;
    const savedSlug = isNew ? res.slug : slug;
    try {
      // (1) Lưu kho như cũ. Lỗi thì không gửi.
      await saveItem(savedSlug, old, res.item, unansweredId);
    } catch (e) {
      errList.replaceChildren(msg("bad", errText(e)));
      updateSaveBtn();
      return;
    }
    if (send?.active) {
      // (2) Gửi; lỗi gửi không hoàn tác đáp án đã lưu.
      await runSend({ unansweredId, answerText: send.answerText, askIds: send.selected.map((a) => a.id),
        kbItemId: savedSlug, asks: replyAsks, title: "Đã lưu đáp án. Gửi trả lời cho người đã hỏi", onClose: onDone });
      return;
    }
    closeDialog();
    await onDone?.();
  });

  const meta = old
    ? h("p", { class: "muted" },
      `Phiên bản ${old.version ?? "-"} · Bot đã dùng ${fmtNum.format(old.hit_count ?? 0)} lần`,
      old.last_hit_at ? ` (lần cuối ${when(old.last_hit_at)})` : "",
      old.approved_by ? ` · Duyệt bởi ${old.approved_by}` : "",
      old.updated_at ? ` · Sửa ${when(old.updated_at)}` : "")
    : null;

  openDialog(
    h("h2", {}, heading ?? (isNew ? "Thêm mục mới" : `Sửa mục: ${old?.title ?? slug}`)),
    meta,
    field("slug", "Mã mục (slug)", isNew ? "chữ thường không dấu, gạch ngang; không đổi được sau khi tạo" : "", slugInput),
    field("title", "Tiêu đề", "", titleInput),
    field("topic", "Nhóm", "", h("input", { autocomplete: "off" })),
    field("questions", "Các cách hỏi", "mỗi dòng một cách; AI dựa vào tiêu đề và phần này để chọn mục", questionsInput),
    h("div", { class: "row", style: "margin-top:6px" }, suggestBtn,
      h("span", { class: "hint" }, "AI gợi ý dựa trên tiêu đề (và nội dung trả lời nếu có); bạn chọn câu nào thêm vào")),
    suggestBox,
    field("answer", "Nội dung trả lời", "bot gửi nguyên văn", answerInput),
    counter,
    field("links", "Link", 'mỗi dòng "Nhãn | https://..."', h("textarea", { rows: 3 })),
    h("label", { class: "f" }, "Ảnh", h("span", { class: "hint" },
      " gửi sau tin chữ, theo thứ tự dưới đây; trang tự thu nhỏ còn cạnh dài 1.600 px")),
    imageNote,
    imagesBox,
    h("div", { class: "row" }, addImageBtn, fileInput),
    imageMsg,
    field("keywords", "Từ khóa", "cách nhau bằng dấu phẩy", h("input", { autocomplete: "off" })),
    field("source", "Nguồn", "bắt buộc khi duyệt", h("input", { autocomplete: "off" })),
    field("status", "Trạng thái", "chỉ mục Đã duyệt mới được bot dùng; không xóa mục, dùng Đã ẩn", statusSelect),
    confirmRow,
    block?.el,
    errList,
    h("div", { class: "actions" },
      h("button", { class: "btn", onclick: closeDialog }, "Hủy"),
      saveBtn,
    ),
  );
  drawImages();
  check();
}

/** Thu nhỏ, chuyển JPEG (quyết định 9), tải lên Storage, trả phần tử của `images`. */
async function uploadImage(slug, file) {
  const bmp = await createImageBitmap(file);
  const size = scaleSize(bmp.width, bmp.height);
  const canvas = document.createElement("canvas");
  canvas.width = size.width;
  canvas.height = size.height;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; // nền trắng cho ảnh PNG trong suốt
  ctx.fillRect(0, 0, size.width, size.height);
  ctx.drawImage(bmp, 0, 0, size.width, size.height);
  bmp.close?.();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", IMAGE_QUALITY));
  if (!blob) throw new Error("Trình duyệt không chuyển được ảnh sang JPEG.");
  if (blob.size > MAX_UPLOAD_BYTES) throw new Error("Ảnh sau khi nén vẫn quá 5 MB.");
  const id = crypto.randomUUID().replace(/-/g, "");
  const path = `${IMAGE_FOLDER}/${slug}/${id}.jpg`;
  const r = storageRef(storage, path);
  await uploadBytes(r, blob, { contentType: "image/jpeg", cacheControl: "public, max-age=31536000" });
  const url = await getDownloadURL(r);
  return { url, path, caption: "", width: size.width, height: size.height, bytes: blob.size };
}

// ---------- Màn: Kho tri thức ----------
const kbFilter = { q: "", status: "", topic: "" };
const kbPage = { page: 1, size: savedPageSize("kb") };

async function renderKb(notice) {
  await loadKb();
  const entries = [...state.kb.entries()];
  const topics = [...new Set(entries.map(([, d]) => d.topic).filter(Boolean))].sort((a, b) => a.localeCompare(b, "vi"));
  const counts = Object.fromEntries(STATUSES.map((s) => [s, entries.filter(([, d]) => d.status === s).length]));
  const listBox = h("div");
  const draw = () => {
    const rows = filterItems(entries, kbFilter);
    const slice = pageSlice(rows, kbPage.page, kbPage.size);
    kbPage.page = slice.page;
    const bar = () => pager({
      slice, size: kbPage.size,
      onPage: (n) => {
        kbPage.page = n;
        draw();
        listBox.scrollIntoView({ block: "nearest" });
      },
      onSize: (size) => {
        kbPage.size = size;
        kbPage.page = 1;
        savePageSize("kb", size);
        draw();
      },
    });
    listBox.replaceChildren(...nodes(
      h("p", { class: "muted" }, `${rows.length}/${entries.length} mục`),
      ...slice.items.map(([slug, d]) => h("div", {
        class: "card item",
        onclick: () => itemEditor({ slug, form: itemToForm(slug, d), onDone: () => renderKb(msg("ok", "Đã lưu.")) }),
      },
      h("h3", {}, d.title ?? slug),
      h("div", { class: "row muted" },
        h("span", { class: `chip ${d.status}` }, STATUS_LABELS[d.status] ?? d.status),
        d.topic ? h("span", { class: "chip" }, d.topic) : null,
        h("span", {}, slug),
        h("span", {}, `${d.questions?.length ?? 0} cách hỏi`),
        d.images?.length ? h("span", {}, `${d.images.length} ảnh`) : null,
        h("span", {}, `bot dùng ${fmtNum.format(d.hit_count ?? 0)} lần`),
      ))),
      bar(),
    ));
  };
  const search = h("input", { placeholder: "Tìm theo tiêu đề, cách hỏi, từ khóa…", value: kbFilter.q, class: "grow" });
  search.addEventListener("input", () => {
    kbFilter.q = search.value;
    kbPage.page = 1;
    draw();
  });
  const statusSel = h("select", { style: "width:auto" }, h("option", { value: "" }, "Mọi trạng thái"),
    STATUSES.map((s) => h("option", { value: s }, `${STATUS_LABELS[s]} (${counts[s]})`)));
  statusSel.value = kbFilter.status;
  statusSel.addEventListener("change", () => {
    kbFilter.status = statusSel.value;
    kbPage.page = 1;
    draw();
  });
  const topicSel = h("select", { style: "width:auto" }, h("option", { value: "" }, "Mọi nhóm"),
    topics.map((t) => h("option", { value: t }, t)));
  topicSel.value = topics.includes(kbFilter.topic) ? kbFilter.topic : "";
  topicSel.addEventListener("change", () => {
    kbFilter.topic = topicSel.value;
    kbPage.page = 1;
    draw();
  });
  show(
    notice ?? null,
    h("div", { class: "row", style: "margin-bottom:12px" },
      search, statusSel, topicSel,
      h("button", {
        class: "btn primary",
        onclick: () => itemEditor({ slug: null, form: itemToForm("", null), onDone: () => renderKb(msg("ok", "Đã thêm mục.")) }),
      }, "+ Thêm mục"),
    ),
    listBox,
  );
  draw();
}

// ---------- Màn: Thống kê ----------
let statsDays = 7;

/** Biểu đồ tròn (vành khuyên) các mục được dùng nhiều nhất, kèm chú thích có số lượt và phần trăm. */
function itemsPie(s) {
  const slices = pieSlices(s.topItems, s.itemTotal);
  if (!slices.length) return h("p", { class: "muted" }, "Chưa có lượt nào trong khoảng này.");
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs, text) => {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    return el;
  };
  const color = (i, sl) => (sl.slug === null ? "var(--s-other)" : `var(--s${i + 1})`);
  const name = (sl) => (sl.slug === null ? "Các mục khác" : state.kb.get(sl.slug)?.title ?? sl.slug);
  const total = slices.reduce((a, x) => a + x.count, 0);
  const svg = svgEl("svg", { viewBox: "-100 -100 200 200", role: "img", "aria-label": "Biểu đồ tròn các mục được dùng nhiều nhất" });
  let a = 0;
  slices.forEach((sl, i) => {
    const p = svgEl("path", { d: pieArc(a, a + sl.share, 96), fill: color(i, sl) });
    p.appendChild(svgEl("title", {}, `${name(sl)}: ${fmtNum.format(sl.count)} lượt (${pct(sl.share)})`));
    svg.appendChild(p);
    a += sl.share;
  });
  // Lỗ giữa (vành khuyên) ghi tổng lượt.
  svg.appendChild(svgEl("circle", { r: 54, fill: "var(--card)" }));
  svg.appendChild(svgEl("text", { y: 4, "font-size": 26, "font-weight": 700 }, fmtNum.format(total)));
  svg.appendChild(svgEl("text", { y: 24, "font-size": 12, fill: "var(--muted)", style: "fill:var(--muted)" }, "lượt"));
  return h("div", { class: "pie" }, svg,
    h("ul", {}, slices.map((sl, i) => h("li", {},
      h("span", { class: "sw", style: `background:${color(i, sl)}` }),
      h("span", { class: "nm" }, name(sl)),
      h("span", { class: "vl" }, `${fmtNum.format(sl.count)} · ${pct(sl.share)}`)))));
}

/** Dòng quy ra VND dưới ô chi phí, điền sau khi có tỷ giá (không chặn màn Thống kê). */
function vndBox(cost) {
  if (cost === null) return null;
  const value = h("div", { style: "font-weight:600" }, "≈ … đ");
  const note = h("div", { class: "muted" }, "Đang lấy tỷ giá Vietcombank…");
  getFx().then((fx) => {
    const vnd = usdToVnd(cost, fx.rate);
    value.textContent = vnd === null ? "-" : `≈ ${fmtNum.format(vnd)} đ`;
    note.textContent = fxNote(fx);
  }).catch((e) => {
    console.error(e);
    value.textContent = "≈ ? đ";
    note.textContent = "Chưa lấy được tỷ giá Vietcombank, tải lại trang sau.";
  });
  return h("div", {}, value, note);
}

async function renderStats() {
  const now = new Date();
  const days = lastNDays(statsDays, now);
  const month = monthKey(now);
  const [statSnap, usageSnap, cfgSnap] = await Promise.all([
    getDocs(query(collection(db, "stats_daily"), where(documentId(), ">=", days[0]), where(documentId(), "<=", days.at(-1)))),
    getDoc(doc(db, "usage", month)),
    getDoc(doc(db, "config", "main")),
    loadKb(),
  ]);
  const s = summarizeStats(statSnap.docs.map((d) => ({ id: d.id, data: d.data() })), days);
  const usage = usageSnap.exists() ? usageSnap.data() : {};
  const cfg = cfgSnap.exists() ? cfgSnap.data() : {};
  const msgLimit = typeof cfg.monthly_message_limit === "number" ? cfg.monthly_message_limit : BOT_DEFAULTS.monthly_message_limit;
  const aiLimit = typeof cfg.monthly_ai_call_limit === "number" ? cfg.monthly_ai_call_limit : BOT_DEFAULTS.monthly_ai_call_limit;
  const model = typeof cfg.ai_model === "string" ? cfg.ai_model : BOT_DEFAULTS.ai_model;
  const sent = usage.messages_sent ?? 0;
  const aiCalls = usage.ai_calls ?? 0;
  const imageLimit = Number.isInteger(cfg.monthly_image_ai_limit)
    ? cfg.monthly_image_ai_limit
    : BOT_DEFAULTS.monthly_image_ai_limit;
  const imageCalls = usage.image_ai_calls ?? 0;
  const cost = estimateCost(model, usage.ai_input_tokens ?? 0, usage.ai_output_tokens ?? 0);

  const meter = (a, b) => {
    const r = ratio(a, b);
    return h("div", { class: "meter" }, h("i", { class: r >= 0.8 ? "hot" : "", style: `width:${(r * 100).toFixed(1)}%` }));
  };
  const tile = (label, value, extra) => h("div", { class: "tile" }, h("span", { class: "muted" }, label), h("b", {}, value), extra ?? null);
  const rangeSel = h("select", { style: "width:auto" }, [7, 30, 90].map((n) => h("option", { value: n }, `${n} ngày gần nhất`)));
  rangeSel.value = String(statsDays);
  rangeSel.addEventListener("change", () => {
    statsDays = Number(rangeSel.value);
    go("stats");
  });
  const maxQ = Math.max(1, ...s.rows.map((r) => r.questions));

  show(
    h("div", { class: "row", style: "margin:0 0 8px" }, h("h2", { class: "grow", style: "margin:0" }, "Câu hỏi qua AI"), rangeSel),
    h("div", { class: "tiles" },
      tile("Câu hỏi", fmtNum.format(s.totals.questions)),
      tile("Bot tự trả lời", `${fmtNum.format(s.totals.answered)} (${pct(s.autoRate)})`),
      tile("Chuyển ca", fmtNum.format(s.totals.handoff)),
      tile("Lỗi AI", fmtNum.format(s.totals.ai_errors)),
      tile("Câu hỏi bằng ảnh", fmtNum.format(s.totals.image_questions)),
    ),
    h("p", { class: "muted" }, "Chỉ tính câu đi qua luồng AI (khi ai_enabled bật). Số liệu tổng của mọi nhóm."),
    h("div", { class: "card" },
      h("h3", { style: "margin-top:0" }, "Mục được dùng nhiều nhất"),
      itemsPie(s),
    ),
    h("div", { class: "card scroll" },
      h("h3", { style: "margin-top:0" }, "Theo ngày"),
      h("table", {},
        h("tr", {}, h("th", {}, "Ngày"), h("th", { class: "n" }, "Câu hỏi"), h("th", { class: "n" }, "Tự trả lời"),
          h("th", { class: "n" }, "Chuyển ca"), h("th", { class: "n" }, "Lỗi AI"), h("th", { style: "width:30%" }, "")),
        [...s.rows].reverse().map((r) => h("tr", {},
          h("td", {}, `${r.day.slice(8)}/${r.day.slice(5, 7)}`),
          h("td", { class: "n" }, r.questions), h("td", { class: "n" }, r.answered),
          h("td", { class: "n" }, r.handoff), h("td", { class: "n" }, r.ai_errors),
          h("td", {}, h("div", { class: "meter" }, h("i", { style: `width:${((r.questions / maxQ) * 100).toFixed(1)}%` }))),
        )),
      ),
    ),
    h("h2", { style: "margin-top:22px" }, `Tháng ${month.slice(5)}/${month.slice(0, 4)}`),
    h("div", { class: "tiles" },
      tile("Tin đã gửi (hạn mức Zalo)", `${fmtNum.format(sent)} / ${fmtNum.format(msgLimit)}`, meter(sent, msgLimit)),
      tile("Lỗi gửi tin", fmtNum.format(usage.send_errors ?? 0)),
      tile("Ảnh đã gửi", fmtNum.format(usage.photos_sent ?? 0),
        h("span", { class: "muted" }, `đã tính trong tin đã gửi; lỗi ảnh: ${fmtNum.format(usage.photo_errors ?? 0)}`)),
      tile("Lượt gọi AI", `${fmtNum.format(aiCalls)} / ${fmtNum.format(aiLimit)}`, meter(aiCalls, aiLimit)),
      tile("Lỗi AI", fmtNum.format(usage.ai_errors ?? 0)),
      tile("Token vào / ra", `${fmtNum.format(usage.ai_input_tokens ?? 0)} / ${fmtNum.format(usage.ai_output_tokens ?? 0)}`),
      tile("Chi phí AI ước tính", cost === null ? "-" : `$${cost.toFixed(3)}`,
        h("div", {}, vndBox(cost), h("span", { class: "muted" }, model))),
      tile("Lượt đọc ảnh", `${fmtNum.format(imageCalls)} / ${fmtNum.format(imageLimit)}`, meter(imageCalls, imageLimit)),
      tile("Token ảnh vào / ra",
        `${fmtNum.format(usage.image_input_tokens ?? 0)} / ${fmtNum.format(usage.image_output_tokens ?? 0)}`,
        h("span", { class: "muted" },
          `đã tính trong token chung; lỗi AI ảnh: ${fmtNum.format(usage.image_ai_errors ?? 0)}, `
          + `lỗi tải ảnh: ${fmtNum.format(usage.image_fetch_errors ?? 0)}`)),
    ),
  );
}

// ---------- Màn: Cài đặt ----------
async function renderSettings(notice) {
  const ref = doc(db, "config", "main");
  const snap = await getDoc(ref);
  if (!snap.exists()) return show(msg("bad", "Chưa có tài liệu config/main trong Firestore."));
  const raw = snap.data();
  const before = settingsFromConfig(raw);
  const f = structuredClone(before);
  const errBox = h("div");
  const chatsBox = h("div");

  const drawChats = () => {
    chatsBox.replaceChildren(
      ...f.chats.map((c, i) => {
        const id = h("input", { value: c.id, placeholder: "Mã nhóm (chat id)", autocomplete: "off", class: "grow" });
        const label = h("input", { value: c.label, placeholder: "Tên dễ nhớ", autocomplete: "off", class: "grow" });
        id.addEventListener("input", () => (c.id = id.value));
        label.addEventListener("input", () => (c.label = label.value));
        return h("div", { class: "row", style: "margin-bottom:6px" }, id, label,
          h("button", { class: "btn danger", onclick: () => { f.chats.splice(i, 1); drawChats(); } }, "Xóa"));
      }),
      h("button", { class: "btn", onclick: () => { f.chats.push({ id: "", label: "" }); drawChats(); } }, "+ Thêm nhóm"),
    );
  };
  drawChats();

  const ai = h("input", { type: "checkbox", checked: f.ai_enabled, onchange: (e) => (f.ai_enabled = e.target.checked) });
  const reply = h("input", { type: "checkbox", checked: f.reply_enabled, onchange: (e) => (f.reply_enabled = e.target.checked) });
  const threshold = h("input", { type: "number", min: 0, max: 1, step: 0.05, value: f.confidence_threshold, style: "max-width:140px" });
  threshold.addEventListener("input", () => (f.confidence_threshold = threshold.value));
  const handoff = h("textarea", { rows: 3, value: f.handoff_message });
  const handoffCount = h("div", { class: "count" });
  const countHandoff = () => {
    const n = charLength(cleanText(handoff.value));
    handoffCount.textContent = `${n}/${MAX_HANDOFF_CHARS} ký tự`;
    handoffCount.className = n > MAX_HANDOFF_CHARS ? "count over" : "count";
  };
  handoff.addEventListener("input", () => {
    f.handoff_message = handoff.value;
    countHandoff();
  });
  countHandoff();
  const maxImages = h("input", {
    type: "number", min: 0, max: MAX_IMAGES, step: 1, value: f.max_images_per_answer, style: "max-width:140px",
  });
  maxImages.addEventListener("input", () => (f.max_images_per_answer = maxImages.value));
  // Bước F: đọc ảnh người dùng gửi.
  const imageAi = h("input", { type: "checkbox", checked: f.image_ai_enabled, onchange: (e) => (f.image_ai_enabled = e.target.checked) });
  const imageSummary = h("input", {
    type: "checkbox", checked: f.image_summary_enabled, onchange: (e) => (f.image_summary_enabled = e.target.checked),
  });
  const imageText = h("input", {
    type: "checkbox", checked: f.image_text_enabled, onchange: (e) => (f.image_text_enabled = e.target.checked),
  });
  const imageLimit = h("input", {
    type: "number", min: 0, max: MAX_IMAGE_AI_LIMIT, step: 1, value: f.monthly_image_ai_limit, style: "max-width:140px",
  });
  imageLimit.addEventListener("input", () => (f.monthly_image_ai_limit = imageLimit.value));
  const imageQuota = h("textarea", { rows: 2, value: f.image_quota_message });
  imageQuota.addEventListener("input", () => (f.image_quota_message = imageQuota.value));

  const save = async () => {
    const { data, errors } = validateSettings(f);
    errBox.replaceChildren();
    if (!data) return errBox.replaceChildren(list("errs", errors));
    const warns = [];
    if (data.ai_enabled && !before.ai_enabled) warns.push("Bật AI: bot sẽ trả lời bằng nội dung trong kho đã duyệt.");
    if (!data.ai_enabled && before.ai_enabled) warns.push("Tắt AI: bot quay về trả lời kiểu giai đoạn 1.");
    if (!data.reply_enabled && before.reply_enabled) warns.push("Tắt trả lời: bot sẽ không gửi tin nào.");
    if (data.image_ai_enabled && !before.image_ai_enabled) {
      warns.push("Bật đọc ảnh: ảnh có gọi tên bot sẽ được gửi cho dịch vụ AI (Anthropic) để đọc; bot không lưu ảnh."
        + (data.ai_enabled ? "" : " Cần bật cả ai_enabled thì mới có tác dụng."));
    }
    const removed = before.chats.filter((c) => !data.allowed_chat_ids.includes(c.id));
    if (removed.length) warns.push(`Bỏ ${removed.length} nhóm khỏi danh sách: bot sẽ không trả lời các nhóm đó.`);
    if (!data.allowed_chat_ids.length) warns.push("Danh sách nhóm trống: bot sẽ không trả lời nhóm nào.");
    if (warns.length && !confirm(`${warns.join("\n")}\n\nLưu cài đặt?`)) return;
    try {
      await updateDoc(ref, { ...data, updated_at: serverTimestamp(), updated_by: state.user.email });
      await renderSettings(msg("ok", "Đã lưu. Bot áp dụng ở tin nhắn tiếp theo."));
    } catch (e) {
      errBox.replaceChildren(msg("bad", errText(e)));
    }
  };

  show(
    notice ?? null,
    h("div", { class: "card" },
      h("label", { class: "row f" }, reply, "Bot được phép trả lời (reply_enabled)"),
      h("label", { class: "row f" }, ai, "Trả lời bằng kho tri thức qua AI (ai_enabled)"),
      h("label", { class: "f" }, "Ngưỡng tin cậy", h("span", { class: "hint" }, " 0-1; dưới ngưỡng thì chuyển ca")),
      threshold,
      h("label", { class: "f" }, "Tin chuyển ca", h("span", { class: "hint" }, " gửi khi bot không trả lời được")),
      handoff,
      handoffCount,
      h("label", { class: "f" }, "Số ảnh gửi mỗi câu trả lời",
        h("span", { class: "hint" }, ` 0-${MAX_IMAGES}; mỗi ảnh tính 1 tin; ảnh vượt số này thành link; 0 = không gửi ảnh`)),
      maxImages,
    ),
    h("div", { class: "card" },
      h("h3", { style: "margin-top:0" }, "Đọc ảnh người dùng gửi"),
      h("p", { class: "muted" },
        "Chỉ đọc ảnh có gọi tên bot trong chú thích. Ảnh được gửi cho dịch vụ AI để chọn mục trong kho; ",
        "bot không lưu ảnh và vẫn chỉ gửi nội dung đã duyệt."),
      h("label", { class: "row f" }, imageAi, "Bật đọc ảnh (image_ai_enabled; cần bật cả ai_enabled)"),
      h("label", { class: "row f" }, imageSummary,
        "Lưu mô tả ngắn của ảnh cho màn Chưa trả lời (image_summary_enabled; không gửi người dùng)"),
      h("label", { class: "row f" }, imageText,
        "Chép chữ trên ảnh cho màn Lịch sử (image_text_enabled; thông tin cá nhân ẩn mặc định, lưu 90 ngày)"),
      h("label", { class: "f" }, "Hạn mức đọc ảnh mỗi tháng",
        h("span", { class: "hint" }, ` 0-${fmtNum.format(MAX_IMAGE_AI_LIMIT)}; vẫn tính vào hạn mức AI chung`)),
      imageLimit,
      h("label", { class: "f" }, "Tin khi hết hạn mức đọc ảnh",
        h("span", { class: "hint" }, ` tối đa ${MAX_IMAGE_QUOTA_MESSAGE_CHARS} ký tự`)),
      imageQuota,
    ),
    h("div", { class: "card" },
      h("h3", { style: "margin-top:0" }, "Nhóm Zalo được phép"),
      h("p", { class: "muted" }, "Zalo không gửi tên nhóm, nên đặt tên dễ nhớ cho từng mã. Mã nhóm chỉ lưu trong Firestore."),
      chatsBox,
    ),
    h("div", { class: "card muted" },
      `Chỉ xem (sửa trong Firestore Console): model ${raw.ai_model ?? BOT_DEFAULTS.ai_model}, `,
      `hạn mức tin ${fmtNum.format(raw.monthly_message_limit ?? BOT_DEFAULTS.monthly_message_limit)}/tháng, `,
      `hạn mức AI ${fmtNum.format(raw.monthly_ai_call_limit ?? BOT_DEFAULTS.monthly_ai_call_limit)} lượt/tháng.`,
      raw.updated_by ? ` Sửa lần cuối bởi ${raw.updated_by} lúc ${when(raw.updated_at)}.` : "",
    ),
    errBox,
    h("div", { class: "actions" }, h("button", { class: "btn primary", onclick: save }, "Lưu cài đặt")),
  );
}
</script>
