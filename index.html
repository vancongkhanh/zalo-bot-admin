<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị Bot TTHC</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #5f6b7a; --line: #dde2e8;
    --accent: #1f5fbf; --accent-text: #ffffff; --ok: #1d7a46; --warn: #a86400; --bad: #b3261e;
    --ok-bg: #e5f4ea; --warn-bg: #fdf1dc; --bad-bg: #fbe7e5; --chip: #eef1f5;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s-other: #9aa3ad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1b2129; --text: #e6e9ee; --muted: #9aa5b3; --line: #2d3540;
      --accent: #6ea2f5; --accent-text: #0b1220; --ok: #6fd39a; --warn: #f0b45a; --bad: #f28b82;
      --ok-bg: #173225; --warn-bg: #3a2a12; --bad-bg: #3d1a18; --chip: #262e38;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s-other: #6b7480;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bar h1 { font-size: 17px; margin: 0; flex: 1 1 auto; }
  .who { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  nav { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
  nav button { border: 0; background: none; padding: 10px 12px; color: var(--muted); border-bottom: 2px solid transparent;
    font: inherit; cursor: pointer; white-space: nowrap; }
  nav button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1 1 200px; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .chip.approved { background: var(--ok-bg); color: var(--ok); }
  .chip.draft { background: var(--warn-bg); color: var(--warn); }
  .chip.hidden { background: var(--chip); color: var(--muted); }
  .sample { margin: 2px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  button.btn, a.btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.btn.danger { color: var(--bad); }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; width: 100%; }
  textarea { min-height: 80px; resize: vertical; }
  input[type=checkbox] { width: auto; }
  label.f { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 14px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  .msg { border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; overflow-wrap: anywhere; }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .errs { color: var(--bad); font-size: 13px; margin: 6px 0 0; padding-left: 18px; }
  .warns { color: var(--warn); font-size: 13px; margin: 6px 0 0; padding-left: 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .tile b { display: block; font-size: 22px; }
  .meter { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .meter i.hot { background: var(--bad); }
  .pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .pager .pages { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .pager button.btn { min-width: 36px; padding: 5px 9px; }
  .pager button.btn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .pager select { width: auto; }
  .pie { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .pie svg { width: 180px; height: 180px; flex: none; }
  .pie svg path { stroke: var(--card); stroke-width: 2; }
  .pie svg path:hover { opacity: .85; }
  .pie svg text { fill: var(--text); text-anchor: middle; }
  .pie ul { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 220px; }
  .pie li { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .pie li:last-child { border-bottom: 0; }
  .pie .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; transform: translateY(1px); }
  .pie .nm { flex: 1; overflow-wrap: anywhere; }
  .pie .vl { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  .item { cursor: pointer; }
  .item:hover { border-color: var(--accent); }
  .item h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 32px));
    background: var(--card); color: var(--text); max-height: calc(100vh - 32px); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg { padding: 16px; overflow-y: auto; max-height: calc(100vh - 34px); }
  .dlg h2 { margin: 0 0 6px; font-size: 18px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
  .count { font-size: 12px; color: var(--muted); text-align: right; }
  .count.over { color: var(--bad); font-weight: 600; }
  .center { text-align: center; padding: 40px 16px; }
  .imgrow { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .imgrow img { width: 96px; height: 72px; object-fit: cover; border-radius: 6px; background: var(--chip); display: block; }
  .imgrow .btn { padding: 5px 10px; }
  .hist .clickable { cursor: pointer; }
  .chip.st-ok { background: var(--ok-bg); color: var(--ok); }
  .chip.st-warn { background: var(--warn-bg); color: var(--warn); }
  .chip.st-bad { background: var(--bad-bg); color: var(--bad); }
  .chip.st-muted { color: var(--muted); }
  .histd { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 6px; }
  .histd h4 { margin: 10px 0 4px; font-size: 14px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px; font-size: 14px; overflow-wrap: anywhere; }
  .quote { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .photo { position: relative; display: inline-block; max-width: 100%; margin: 6px 0; border-radius: 8px;
    overflow: hidden; border: 1px solid var(--line); background: var(--chip); }
  .photo img { display: block; max-width: 100%; max-height: 420px; }
  .photo img.blur { filter: blur(18px); transform: scale(1.05); }
  .photo .btn { position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; }
  mark.pii { background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 0 3px; }
  @media (max-width: 600px) { .kv { grid-template-columns: 1fr; gap: 0; margin-bottom: 4px; } }
  @media (max-width: 600px) {
    dialog { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; margin: 0; border-radius: 0; }
    .dlg { max-height: 100vh; }
    .bar h1 { font-size: 15px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Quản trị Bot TTHC Đảng</h1>
    <span class="who" id="who"></span>
    <button class="btn" id="signout" hidden>Đăng xuất</button>
  </div>
  <nav id="tabs" hidden></nav>
</header>
<main id="app"><div class="center muted">Đang tải…</div></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script type="module">
// =====================================================================
// Cấu hình Firebase (công khai theo thiết kế; an toàn dựa vào đăng nhập và quy tắc Firestore).
// Lấy từ Firebase Console > Project settings > Your apps > Web app.
// =====================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBcu6RrT6mHVnw0dZegN4unuYhj1C7w20Q",
  authDomain: "zalo-bot-tthc-dang.firebaseapp.com",
  projectId: "zalo-bot-tthc-dang",
  appId: "1:921284178915:web:8598615347c0df91da26d6",
  // Bước E: tên bucket hiện ở Firebase Console > Storage sau khi bật (dạng gs://<tên>).
  storageBucket: "zalo-bot-tthc-dang.firebasestorage.app",
};
const SDK_VERSION = "13.1.0";

/* LOGIC-START: hàm thuần, không đụng DOM hay Firebase (kiểm thử trong admin/test). */
const MAX_ANSWER_CHARS = 1500;
const MAX_HANDOFF_CHARS = 1000;
const MAX_QUESTIONS = 50;
const MAX_LINKS = 10;
const SLUG_PATTERN = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
const STATUSES = ["draft", "approved", "hidden"];
const CONTENT_FIELDS = ["title", "topic", "questions", "answer", "links", "keywords", "source", "images"];
// Bước E: ảnh trong câu trả lời.
const MAX_IMAGES = 10;
const MAX_CAPTION_CHARS = 200;
const IMAGE_MAX_SIDE = 1600;
const IMAGE_QUALITY = 0.85;
const MAX_SOURCE_IMAGE_BYTES = 10 * 1024 * 1024;
const MAX_UPLOAD_BYTES = 5 * 1024 * 1024; // giống storage.rules
const IMAGE_FOLDER = "kb_images";
const TIMEZONE = "Asia/Ho_Chi_Minh";
// Giống DEFAULT_CONFIG trong functions/src/config.ts.
const BOT_DEFAULTS = {
  ai_enabled: false,
  reply_enabled: true,
  confidence_threshold: 0.7,
  handoff_message: "Câu hỏi của anh/chị đã được ghi nhận, chuyên viên sẽ hỗ trợ sớm.",
  monthly_message_limit: 3000,
  monthly_ai_call_limit: 6000,
  ai_model: "claude-haiku-5-5",
  max_images_per_answer: 4,
  // Bước F: đọc ảnh người dùng gửi.
  image_ai_enabled: false,
  monthly_image_ai_limit: 300,
  image_quota_message: "Bot tạm không đọc được ảnh, bạn gõ câu hỏi bằng chữ giúp nhé.",
  image_summary_enabled: true,
  // Bước G: chép chữ trên ảnh cho màn Lịch sử.
  image_text_enabled: true,
};
const MAX_IMAGE_AI_LIMIT = 10000;
const MAX_IMAGE_QUOTA_MESSAGE_CHARS = 500;
// USD / 1 triệu token, giống scripts/kb/lib/eval.mjs.
const PRICES = {
  "claude-haiku-5-5": { input: 0.1, output: 0.5 },
  "claude-sonnet-5-5": { input: 2, output: 10 },
  "claude-opus-5-5": { input: 4, output: 20 },
};
const REASON_LABELS = {
  no_match: "Kho không có",
  low_confidence: "AI không chắc",
  ai_error: "Lỗi AI",
  ai_quota: "Hết hạn mức AI",
  image_quota: "Hết hạn mức đọc ảnh",
  image_fetch_error: "Không tải được ảnh",
};
const IMAGE_TAG = "[Ảnh] ";

/** Mẫu câu từ tin ảnh có tiền tố "[Ảnh] "; bỏ tiền tố khi dùng làm cách hỏi. */
function stripImageTag(s) {
  const t = String(s ?? "");
  return t.startsWith(IMAGE_TAG) ? t.slice(IMAGE_TAG.length).trim() : t;
}
const STATUS_LABELS = { draft: "Nháp", approved: "Đã duyệt", hidden: "Đã ẩn" };
const PLATFORM_LABEL = { youtube: "YouTube", facebook: "Facebook", drive: "Drive", other: "Liên kết" };

function charLength(s) {
  return Array.from(s ?? "").length;
}

function cleanText(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/\r\n?/g, "\n").normalize("NFC").trim();
}

function oneLine(v) {
  return cleanText(v).replace(/\s+/g, " ");
}

function splitLines(v) {
  const seen = new Set();
  const out = [];
  for (const line of cleanText(v).split("\n")) {
    const t = line.trim().replace(/\s+/g, " ");
    if (t && !seen.has(t)) {
      seen.add(t);
      out.push(t);
    }
  }
  return out;
}

function splitKeywords(v) {
  const seen = new Set();
  const out = [];
  for (const k of cleanText(v).split(/[,\n]/)) {
    const t = k.trim().replace(/\s+/g, " ");
    if (t && !seen.has(t)) {
      seen.add(t);
      out.push(t);
    }
  }
  return out;
}

function detectPlatform(url) {
  let host;
  try {
    host = new URL(url).hostname.toLowerCase().replace(/^www\.|^m\./, "");
  } catch {
    return "other";
  }
  if (host === "youtu.be" || host.endsWith("youtube.com")) return "youtube";
  if (host === "fb.watch" || host.endsWith("facebook.com") || host === "fb.com") return "facebook";
  if (host === "drive.google.com" || host === "docs.google.com") return "drive";
  return "other";
}

/** Mỗi dòng "Nhãn | https://..." hoặc chỉ "https://...". Cùng quy tắc với script kb-import. */
function parseLinks(v) {
  const links = [];
  const errors = [];
  for (const line of splitLines(v)) {
    const bar = line.lastIndexOf("|");
    const label = bar >= 0 ? line.slice(0, bar).trim() : "";
    const url = (bar >= 0 ? line.slice(bar + 1) : line).trim();
    let ok = false;
    try {
      const u = new URL(url);
      ok = u.protocol === "https:" && !!u.hostname && !/\s/.test(url);
    } catch {
      ok = false;
    }
    if (!ok) {
      errors.push(`Link không hợp lệ (phải là "Nhãn | https://..."): ${line.slice(0, 120)}`);
      continue;
    }
    const platform = detectPlatform(url);
    links.push({ label: label || PLATFORM_LABEL[platform], url, platform });
  }
  return { links, errors };
}

function formatLinks(links) {
  return (links ?? []).map((l) => `${l.label} | ${l.url}`).join("\n");
}

/** Bỏ dấu, chữ thường (tìm kiếm, gợi ý slug). */
function unaccent(s) {
  return String(s ?? "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .replace(/đ/g, "d")
    .replace(/Đ/g, "D")
    .toLowerCase();
}

function suggestSlug(title, max = 60) {
  let s = unaccent(title).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  if (s.length > max) {
    s = s.slice(0, max);
    const cut = s.lastIndexOf("-");
    if (cut > 20) s = s.slice(0, cut);
    s = s.replace(/-+$/g, "");
  }
  return s;
}

/** Mục vào form sửa (chuỗi nhiều dòng). */
function itemToForm(slug, d) {
  return {
    slug: slug ?? "",
    title: d?.title ?? "",
    topic: d?.topic ?? "",
    questions: (d?.questions ?? []).join("\n"),
    answer: d?.answer ?? "",
    links: formatLinks(d?.links),
    keywords: (d?.keywords ?? []).join(", "),
    source: d?.source ?? "",
    status: d?.status ?? "draft",
    images: normalizeImages(d?.images),
  };
}

/** Bản sao danh sách ảnh của mục (bỏ phần tử hỏng). */
function normalizeImages(images) {
  if (!Array.isArray(images)) return [];
  return images
    .filter((im) => im && typeof im.url === "string" && typeof im.path === "string")
    .map((im) => ({
      url: im.url,
      path: im.path,
      caption: typeof im.caption === "string" ? im.caption : "",
      width: Number.isFinite(im.width) ? im.width : 0,
      height: Number.isFinite(im.height) ? im.height : 0,
      bytes: Number.isFinite(im.bytes) ? im.bytes : 0,
    }));
}

/** Kiểm tra danh sách ảnh của form; ảnh phải nằm trong thư mục của chính mục. */
function validateImages(images, slug, { localUrls = false } = {}) {
  const errors = [];
  const out = [];
  const list = Array.isArray(images) ? images : [];
  if (list.length > MAX_IMAGES) errors.push(`Tối đa ${MAX_IMAGES} ảnh mỗi mục`);
  list.forEach((im, i) => {
    const caption = oneLine(im?.caption);
    if (charLength(caption) > MAX_CAPTION_CHARS) errors.push(`Chú thích ảnh ${i + 1} dài quá ${MAX_CAPTION_CHARS} ký tự`);
    // Bot chỉ gửi link https; link cục bộ chỉ có ở Storage emulator.
    const okUrl = typeof im?.url === "string"
      && (im.url.startsWith("https://") || (localUrls && /^http:\/\/(127\.0\.0\.1|localhost):/.test(im.url)));
    const okPath = typeof im?.path === "string" && im.path.startsWith(`${IMAGE_FOLDER}/${slug}/`);
    if (!okUrl || !okPath) errors.push(`Ảnh ${i + 1} không hợp lệ (gỡ rồi tải lại)`);
    out.push({
      url: im?.url ?? "",
      path: im?.path ?? "",
      caption,
      width: Number.isFinite(im?.width) ? im.width : 0,
      height: Number.isFinite(im?.height) ? im.height : 0,
      bytes: Number.isFinite(im?.bytes) ? im.bytes : 0,
    });
  });
  return { images: out, errors };
}

/** Kích thước sau khi thu nhỏ: cạnh dài tối đa `max`, không phóng to. */
function scaleSize(width, height, max = IMAGE_MAX_SIDE) {
  const long = Math.max(width, height);
  if (!(long > max)) return { width: Math.round(width), height: Math.round(height) };
  const k = max / long;
  return { width: Math.max(1, Math.round(width * k)), height: Math.max(1, Math.round(height * k)) };
}

/** Lý do chặn tệp ảnh trước khi xử lý; null nếu nhận. */
function imageFileProblem(file) {
  if (!file || !/^image\//.test(file.type ?? "")) return "Không phải tệp ảnh";
  if (file.size > MAX_SOURCE_IMAGE_BYTES) {
    return `Ảnh gốc ${(file.size / 1048576).toFixed(1)} MB, tối đa ${MAX_SOURCE_IMAGE_BYTES / 1048576} MB`;
  }
  return null;
}

/** Câu giải thích bot sẽ gửi ảnh thế nào (form mục). */
function imageSendNote(count, maxPerAnswer) {
  if (!count) return "";
  const max = Number.isInteger(maxPerAnswer) ? maxPerAnswer : BOT_DEFAULTS.max_images_per_answer;
  if (max === 0) return `Đang tắt gửi ảnh (tối đa 0 ảnh/câu): ${count} ảnh sẽ thành link trong tin chữ.`;
  if (count <= max) return `Bot gửi tin chữ rồi ${count} ảnh (mỗi ảnh tính 1 tin).`;
  return `Bot gửi ${max} ảnh đầu, ${count - max} ảnh sau thành link trong tin chữ.`;
}

/** Lý do không duyệt được; cùng điều kiện với script kb-approve. */
function approveProblems(item) {
  const problems = [];
  if (!item.answer) problems.push("thiếu nội dung trả lời");
  if (!Array.isArray(item.questions) || item.questions.length < 2) problems.push("cần ít nhất 2 cách hỏi");
  if (!item.source) problems.push("thiếu nguồn");
  return problems;
}

/**
 * Kiểm tra form mục kho. Cùng quy tắc với kb-import (validate.mjs).
 * @returns {{ slug: string, item: object|null, errors: string[], warnings: string[] }}
 */
function validateItemForm(f, { isNew = false, existingSlugs = new Set(), localImageUrls = false } = {}) {
  const errors = [];
  const warnings = [];
  const slug = cleanText(f.slug);
  if (isNew) {
    if (!slug) errors.push("Mã mục (slug) trống");
    else if (!SLUG_PATTERN.test(slug)) errors.push("Mã mục chỉ gồm chữ thường không dấu, số, nối bằng gạch ngang");
    else if (slug.length > 80) errors.push("Mã mục dài quá 80 ký tự");
    else if (existingSlugs.has(slug)) errors.push(`Mã mục "${slug}" đã có trong kho`);
  }
  const title = oneLine(f.title);
  if (!title) errors.push("Tiêu đề trống");
  else if (charLength(title) > 200) errors.push("Tiêu đề dài quá 200 ký tự");
  const topic = oneLine(f.topic);
  if (charLength(topic) > 100) errors.push("Nhóm dài quá 100 ký tự");
  const answer = cleanText(f.answer);
  const answerLen = charLength(answer);
  if (!answer) errors.push("Nội dung trả lời trống");
  else if (answerLen > MAX_ANSWER_CHARS) errors.push(`Nội dung trả lời dài ${answerLen} ký tự, tối đa ${MAX_ANSWER_CHARS}`);
  const status = STATUSES.includes(f.status) ? f.status : "draft";
  const questions = splitLines(f.questions);
  if (questions.length > MAX_QUESTIONS) errors.push(`Tối đa ${MAX_QUESTIONS} cách hỏi`);
  const source = oneLine(f.source);
  if (charLength(source) > 500) errors.push("Nguồn dài quá 500 ký tự");
  const { links, errors: linkErrors } = parseLinks(f.links);
  errors.push(...linkErrors);
  if (links.length > MAX_LINKS) errors.push(`Tối đa ${MAX_LINKS} link`);
  const keywords = splitKeywords(f.keywords);
  if (keywords.length > 50) errors.push("Tối đa 50 từ khóa");
  const { images, errors: imageErrors } = validateImages(f.images, slug, { localUrls: localImageUrls });
  errors.push(...imageErrors);
  const item = { title, topic, questions, answer, links, keywords, source, status, images };
  if (status === "approved") {
    for (const p of approveProblems(item)) errors.push(`Không duyệt được: ${p}`);
  } else {
    if (questions.length < 2) warnings.push(`Mới có ${questions.length} cách hỏi (nên 3-8; cần ít nhất 2 để duyệt)`);
    if (!source) warnings.push("Chưa có nguồn (bắt buộc khi duyệt)");
  }
  return { slug, item: errors.length ? null : item, errors, warnings };
}

function diffContent(a, b) {
  // Mục cũ chưa có trường images được coi như danh sách ảnh rỗng.
  const val = (o, k) => JSON.stringify(k === "images" ? normalizeImages(o?.[k]) : (o?.[k] ?? null));
  return CONTENT_FIELDS.filter((k) => val(a, k) !== val(b, k));
}

/** Lưu thay đổi này có ảnh hưởng ngay đến câu trả lời của bot không (cần xác nhận rõ). */
function needsLiveConfirm(old, item) {
  if (item.status === "approved" && old?.status !== "approved") return true;
  return old?.status === "approved" && item.status === "approved" && diffContent(old, item).length > 0;
}

/**
 * Dữ liệu ghi Firestore cho một lần lưu, khớp quy tắc trong firestore.rules.
 * `now` là FieldValue serverTimestamp() (hoặc giá trị giả khi kiểm thử).
 * Trả null khi không có gì thay đổi.
 */
function buildItemWrite(old, item, email, now) {
  const approved = item.status === "approved";
  if (!old) {
    return {
      title: item.title,
      topic: item.topic,
      questions: item.questions,
      answer: item.answer,
      links: item.links,
      keywords: item.keywords,
      source: item.source,
      status: item.status,
      images: item.images ?? [],
      version: 1,
      steps: [],
      hit_count: 0,
      last_hit_at: null,
      created_at: now,
      updated_at: now,
      updated_by: email,
      approved_at: approved ? now : null,
      approved_by: approved ? email : null,
    };
  }
  const changedFields = diffContent(old, item);
  const statusChanged = old.status !== item.status;
  if (!changedFields.length && !statusChanged) return null;
  const data = {};
  for (const k of changedFields) data[k] = item[k];
  if (statusChanged) data.status = item.status;
  if (changedFields.length) data.version = (Number.isInteger(old.version) ? old.version : 0) + 1;
  data.updated_at = now;
  data.updated_by = email;
  if (approved) {
    data.approved_at = now;
    data.approved_by = email;
  }
  return data;
}

/** Thêm câu hỏi mới vào danh sách cách hỏi của mục (bỏ câu trùng, giữ thứ tự). */
function mergeQuestions(existing, added) {
  const out = [...(existing ?? [])];
  const seen = new Set(out.map((q) => unaccent(q).replace(/\s+/g, " ").trim()));
  for (const q of added) {
    const t = oneLine(q);
    const k = unaccent(t);
    if (t && !seen.has(k)) {
      seen.add(k);
      out.push(t);
    }
  }
  return out;
}

/** Ô "Các cách hỏi" sau khi thêm các gợi ý đã chọn (bỏ câu trùng, kể cả khác dấu). */
function addQuestionsText(text, added) {
  return mergeQuestions(splitLines(text), added).join("\n");
}

/** Dữ liệu gửi hàm suggestQuestions từ form mục. */
function suggestPayload(f) {
  return {
    title: oneLine(f.title),
    topic: oneLine(f.topic),
    answer: cleanText(f.answer).slice(0, MAX_ANSWER_CHARS),
    questions: splitLines(f.questions).slice(0, MAX_QUESTIONS),
  };
}

/** config/main → form Cài đặt (trường thiếu dùng mặc định của bot). */
function settingsFromConfig(raw) {
  const r = raw ?? {};
  const labels = r.chat_labels && typeof r.chat_labels === "object" ? r.chat_labels : {};
  const ids = Array.isArray(r.allowed_chat_ids) ? r.allowed_chat_ids.filter((x) => typeof x === "string") : [];
  return {
    ai_enabled: typeof r.ai_enabled === "boolean" ? r.ai_enabled : BOT_DEFAULTS.ai_enabled,
    reply_enabled: typeof r.reply_enabled === "boolean" ? r.reply_enabled : BOT_DEFAULTS.reply_enabled,
    confidence_threshold: String(
      typeof r.confidence_threshold === "number" ? r.confidence_threshold : BOT_DEFAULTS.confidence_threshold,
    ),
    handoff_message: typeof r.handoff_message === "string" && r.handoff_message.trim()
      ? r.handoff_message
      : BOT_DEFAULTS.handoff_message,
    max_images_per_answer: String(
      Number.isInteger(r.max_images_per_answer) && r.max_images_per_answer >= 0 && r.max_images_per_answer <= MAX_IMAGES
        ? r.max_images_per_answer
        : BOT_DEFAULTS.max_images_per_answer,
    ),
    image_ai_enabled: typeof r.image_ai_enabled === "boolean" ? r.image_ai_enabled : BOT_DEFAULTS.image_ai_enabled,
    image_summary_enabled: typeof r.image_summary_enabled === "boolean"
      ? r.image_summary_enabled
      : BOT_DEFAULTS.image_summary_enabled,
    monthly_image_ai_limit: String(
      Number.isInteger(r.monthly_image_ai_limit) && r.monthly_image_ai_limit >= 0
        && r.monthly_image_ai_limit <= MAX_IMAGE_AI_LIMIT
        ? r.monthly_image_ai_limit
        : BOT_DEFAULTS.monthly_image_ai_limit,
    ),
    image_text_enabled: typeof r.image_text_enabled === "boolean" ? r.image_text_enabled : BOT_DEFAULTS.image_text_enabled,
    image_quota_message: typeof r.image_quota_message === "string" && r.image_quota_message.trim()
      ? r.image_quota_message
      : BOT_DEFAULTS.image_quota_message,
    chats: ids.map((id) => ({ id, label: typeof labels[id] === "string" ? labels[id] : "" })),
  };
}

/** Kiểm tra form Cài đặt → dữ liệu ghi config/main (chỉ các trường được phép). */
function validateSettings(f) {
  const errors = [];
  const threshold = Number(String(f.confidence_threshold).replace(",", "."));
  if (String(f.confidence_threshold).trim() === "" || !Number.isFinite(threshold) || threshold < 0 || threshold > 1) {
    errors.push("Ngưỡng tin cậy phải là số từ 0 đến 1");
  }
  const handoff = cleanText(f.handoff_message);
  if (!handoff) errors.push("Tin chuyển ca trống");
  else if (charLength(handoff) > MAX_HANDOFF_CHARS) errors.push(`Tin chuyển ca tối đa ${MAX_HANDOFF_CHARS} ký tự`);
  const maxImagesText = String(f.max_images_per_answer ?? BOT_DEFAULTS.max_images_per_answer).trim();
  const maxImages = Number(maxImagesText);
  if (!/^\d+$/.test(maxImagesText) || maxImages > MAX_IMAGES) {
    errors.push(`Số ảnh mỗi câu trả lời phải là số nguyên từ 0 đến ${MAX_IMAGES}`);
  }
  const imageLimitText = String(f.monthly_image_ai_limit ?? BOT_DEFAULTS.monthly_image_ai_limit).trim();
  const imageLimit = Number(imageLimitText);
  if (!/^\d+$/.test(imageLimitText) || imageLimit > MAX_IMAGE_AI_LIMIT) {
    errors.push(`Hạn mức đọc ảnh phải là số nguyên từ 0 đến ${MAX_IMAGE_AI_LIMIT}`);
  }
  const imageQuota = cleanText(f.image_quota_message ?? BOT_DEFAULTS.image_quota_message);
  if (!imageQuota) errors.push("Tin khi hết hạn mức đọc ảnh trống");
  else if (charLength(imageQuota) > MAX_IMAGE_QUOTA_MESSAGE_CHARS) {
    errors.push(`Tin khi hết hạn mức đọc ảnh tối đa ${MAX_IMAGE_QUOTA_MESSAGE_CHARS} ký tự`);
  }
  const ids = [];
  const labels = {};
  for (const c of f.chats ?? []) {
    const id = cleanText(c.id);
    const label = oneLine(c.label);
    if (!id && !label) continue;
    if (!id) {
      errors.push(`Nhãn "${label}" chưa có mã nhóm`);
      continue;
    }
    if (/\s/.test(id) || id.length > 100) {
      errors.push(`Mã nhóm "${id.slice(0, 40)}" không hợp lệ (không chứa khoảng trắng, tối đa 100 ký tự)`);
      continue;
    }
    if (ids.includes(id)) {
      errors.push(`Mã nhóm "${id.slice(0, 40)}" bị trùng`);
      continue;
    }
    if (charLength(label) > 100) errors.push("Nhãn nhóm tối đa 100 ký tự");
    ids.push(id);
    if (label) labels[id] = label;
  }
  if (ids.length > 50) errors.push("Tối đa 50 nhóm");
  if (errors.length) return { data: null, errors };
  return {
    data: {
      ai_enabled: !!f.ai_enabled,
      reply_enabled: !!f.reply_enabled,
      confidence_threshold: threshold,
      handoff_message: handoff,
      max_images_per_answer: maxImages,
      image_ai_enabled: !!f.image_ai_enabled,
      image_summary_enabled: !!(f.image_summary_enabled ?? BOT_DEFAULTS.image_summary_enabled),
      image_text_enabled: !!(f.image_text_enabled ?? BOT_DEFAULTS.image_text_enabled),
      monthly_image_ai_limit: imageLimit,
      image_quota_message: imageQuota,
      allowed_chat_ids: ids,
      chat_labels: labels,
    },
    errors,
  };
}

function dayKey(date, timeZone = TIMEZONE) {
  return new Intl.DateTimeFormat("en-CA", { timeZone, year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
}

function monthKey(date, timeZone = TIMEZONE) {
  return dayKey(date, timeZone).slice(0, 7);
}

/** n ngày gần nhất theo giờ Việt Nam, cũ → mới. */
function lastNDays(n, now = new Date()) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(dayKey(new Date(now.getTime() - i * 86400000)));
  return out;
}

/**
 * @param {Array<{id: string, data: object}>} docs  stats_daily
 * @param {string[]} days
 */
function summarizeStats(docs, days) {
  const byId = new Map(docs.map((d) => [d.id, d.data ?? {}]));
  const num = (v) => (typeof v === "number" && Number.isFinite(v) ? v : 0);
  const totals = { questions: 0, answered: 0, handoff: 0, ai_errors: 0, image_questions: 0 };
  const hits = new Map();
  const rows = days.map((day) => {
    const d = byId.get(day) ?? {};
    const row = {
      day, questions: num(d.questions), answered: num(d.answered), handoff: num(d.handoff), ai_errors: num(d.ai_errors),
      image_questions: num(d.image_questions),
    };
    for (const k of Object.keys(totals)) totals[k] += row[k];
    for (const [slug, v] of Object.entries(d.item_hits ?? {})) hits.set(slug, (hits.get(slug) ?? 0) + num(v));
    return row;
  });
  const topItems = [...hits.entries()]
    .map(([slug, count]) => ({ slug, count }))
    .filter((x) => x.count > 0)
    .sort((a, b) => b.count - a.count || a.slug.localeCompare(b.slug))
    .slice(0, 10);
  const itemTotal = [...hits.values()].reduce((a, v) => a + Math.max(0, v), 0);
  const autoRate = totals.questions ? totals.answered / totals.questions : null;
  return { rows, totals, topItems, itemTotal, autoRate };
}

/**
 * Phần của biểu đồ tròn "Mục được dùng nhiều nhất": tối đa `named` mục lớn nhất,
 * phần còn lại (kể cả mục ngoài top 10) gộp thành "Các mục khác".
 */
function pieSlices(topItems, total, named = 5) {
  const items = (topItems ?? []).filter((t) => t.count > 0);
  const sum = Math.max(total ?? 0, items.reduce((a, t) => a + t.count, 0));
  if (!sum) return [];
  const keep = items.slice(0, named);
  const slices = keep.map((t) => ({ slug: t.slug, count: t.count, share: t.count / sum }));
  const rest = sum - keep.reduce((a, t) => a + t.count, 0);
  if (rest > 0) slices.push({ slug: null, count: rest, share: rest / sum });
  return slices;
}

/** Đường SVG của một phần bánh tròn (tâm 0,0), từ góc a0 đến a1 tính bằng phần của vòng (0..1). */
function pieArc(a0, a1, r) {
  if (a1 - a0 >= 0.9999) return `M0 ${-r}A${r} ${r} 0 1 1 0 ${r}A${r} ${r} 0 1 1 0 ${-r}Z`;
  const pt = (a) => [r * Math.sin(2 * Math.PI * a), -r * Math.cos(2 * Math.PI * a)].map((v) => +v.toFixed(3));
  const [x0, y0] = pt(a0);
  const [x1, y1] = pt(a1);
  return `M0 0L${x0} ${y0}A${r} ${r} 0 ${a1 - a0 > 0.5 ? 1 : 0} 1 ${x1} ${y1}Z`;
}

/** Quy USD ra VND theo tỷ giá; làm tròn đến đồng. Thiếu số liệu thì null. */
function usdToVnd(usd, rate) {
  if (typeof usd !== "number" || !Number.isFinite(usd) || usd < 0) return null;
  if (typeof rate !== "number" || !Number.isFinite(rate) || rate <= 0) return null;
  return Math.round(usd * rate);
}

/** "11/17/2026 11:43:14 AM" (giờ Việt Nam, kiểu Mỹ) → "11:43 17/11/2026"; sai mẫu thì giữ nguyên. */
function vcbTime(s) {
  if (typeof s !== "string" || !s.trim()) return "";
  const m = s.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}) (\d{1,2}):(\d{2})(?::\d{2})? ?(AM|PM)?$/i);
  if (!m) return s.trim().slice(0, 40);
  let hh = Number(m[4]);
  if (m[6]) hh = (hh % 12) + (m[6].toUpperCase() === "PM" ? 12 : 0);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(hh)}:${m[5]} ${p(m[2])}/${p(m[1])}/${m[3]}`;
}

/** Dòng ghi nguồn tỷ giá dưới ô chi phí. */
function fxNote(fx) {
  if (!fx || typeof fx.rate !== "number") return "";
  const rate = new Intl.NumberFormat("vi-VN").format(Math.round(fx.rate));
  const t = vcbTime(fx.source_time);
  const when = t ? ` (cập nhật ${t})` : "";
  return `Giá bán USD ${fx.source ?? "Vietcombank"}: ${rate} đ${when}${fx.stale ? "; tạm dùng tỷ giá cũ" : ""}`;
}

function estimateCost(model, inputTokens, outputTokens) {
  const p = PRICES[model];
  if (!p) return null;
  return ((inputTokens || 0) * p.input + (outputTokens || 0) * p.output) / 1e6;
}

function ratio(a, b) {
  if (!b) return 0;
  return Math.max(0, Math.min(1, a / b));
}

/** Lọc kho theo ô tìm kiếm (không dấu), trạng thái, nhóm. */
function filterItems(entries, { q = "", status = "", topic = "" } = {}) {
  const needle = unaccent(q).trim();
  return entries
    .filter(([slug, d]) => {
      if (status && d.status !== status) return false;
      if (topic && (d.topic ?? "") !== topic) return false;
      if (!needle) return true;
      const hay = unaccent([slug, d.title, d.topic, ...(d.questions ?? []), ...(d.keywords ?? [])].join("\n"));
      return hay.includes(needle);
    })
    .sort(([a, x], [b, y]) => (x.title ?? a).localeCompare(y.title ?? b, "vi"));
}

// ---------- Phân trang danh sách (Lịch sử, Kho tri thức) ----------
const PAGE_SIZES = [10, 20, 50];

/** Số dòng mỗi trang hợp lệ; giá trị lạ thì về 10. */
function pageSize(v) {
  const n = Number(v);
  return PAGE_SIZES.includes(n) ? n : PAGE_SIZES[0];
}

/** Cắt một trang (trang đánh số từ 1, tự kéo về khoảng hợp lệ). */
function pageSlice(rows, page, size) {
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / size));
  const p = Math.min(Math.max(1, Math.floor(Number(page)) || 1), pages);
  const start = (p - 1) * size;
  const items = rows.slice(start, start + size);
  return { items, page: p, pages, total, from: total ? start + 1 : 0, to: start + items.length };
}

/** Các nút số trang: luôn có trang đầu, cuối, trang hiện tại ±1; null là dấu "…". */
function pageNumbers(page, pages) {
  const keep = [...new Set([1, page - 1, page, page + 1, pages])].filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
  const out = [];
  keep.forEach((n, i) => {
    if (i && n - keep[i - 1] === 2) out.push(n - 1);
    else if (i && n - keep[i - 1] > 2) out.push(null);
    out.push(n);
  });
  return out;
}

// ---------- Bước G: Lịch sử hỗ trợ ----------
const HISTORY_PAGE_SIZE = 50;
/** Tin gọi tên bot mà bot không trả lời (outcome ignored). Các lý do khác (no_mention…) không bao giờ hiện. */
const SILENT_REASONS = ["reply_disabled", "quota", "image_ai_disabled"];
const SILENT_LABELS = {
  reply_disabled: "Đang tắt trả lời",
  quota: "Hết hạn mức tin trong tháng",
  image_ai_disabled: "Chưa bật đọc ảnh",
};
const HISTORY_KINDS = [
  ["all", "Tất cả"],
  ["answered", "Trả lời được"],
  ["handoff", "Chuyển ca"],
  ["error", "Lỗi"],
  ["silent", "Bot không trả lời"],
];
const HISTORY_RANGES = [
  ["today", "Hôm nay"],
  ["7", "7 ngày"],
  ["30", "30 ngày"],
  ["90", "90 ngày"],
];
const PII_OPEN = "⟦";
const PII_CLOSE = "⟧";
const PII_MASK = "[đã ẩn]";

/** Điều kiện truy vấn: các cặp [trường, giá trị cho "in"], nối bằng HOẶC. */
function historyClauses(kind) {
  const answered = ["outcome", ["answered", "replied"]];
  const handoff = ["outcome", ["handoff"]];
  const silent = ["ignore_reason", SILENT_REASONS];
  if (kind === "answered") return [answered];
  if (kind === "handoff") return [handoff];
  if (kind === "error") return [["outcome", ["error"]], ["send_ok", [false]]];
  if (kind === "silent") return [silent];
  return [["outcome", ["answered", "replied", "handoff", "error"]], silent];
}

/** Mốc bắt đầu: "today" là 0 giờ hôm nay giờ Việt Nam; số là n ngày gần nhất (gồm hôm nay). */
function historySince(range, now = new Date()) {
  const days = range === "today" ? 1 : Number(range) || 7;
  const first = dayKey(new Date(now.getTime() - (days - 1) * 86400000));
  return new Date(`${first}T00:00:00+07:00`);
}

/** Chỉ tin có gọi tên bot (phòng dữ liệu lạ lọt qua truy vấn). */
function isHistoryRecord(c) {
  if (!c || typeof c !== "object") return false;
  if (c.outcome === "ignored") return SILENT_REASONS.includes(c.ignore_reason);
  return ["answered", "replied", "handoff", "error"].includes(c.outcome);
}

/** Nhãn kết quả của một lần hỗ trợ. */
function historyStatus(c) {
  if (c.outcome === "error" || c.send_ok === false) return { key: "error", label: "Lỗi gửi tin", cls: "bad" };
  if (c.outcome === "answered" || c.outcome === "replied") return { key: "answered", label: "Trả lời được", cls: "ok" };
  if (c.outcome === "handoff") return { key: "handoff", label: "Chuyển ca", cls: "warn" };
  return { key: "silent", label: "Bot không trả lời", cls: "muted" };
}

/** Dòng khớp đúng nhãn của bộ lọc (ví dụ "Trả lời được" không gồm tin gửi lỗi). */
function matchesKind(c, kind) {
  return isHistoryRecord(c) && (kind === "all" || historyStatus(c).key === kind);
}

function historySummary(rows) {
  const out = { total: 0, answered: 0, handoff: 0, error: 0, silent: 0, image: 0 };
  for (const c of rows) {
    out.total++;
    out[historyStatus(c).key]++;
    if (c.source === "image") out.image++;
  }
  return out;
}

/**
 * Tìm chữ (không dấu) trong các dòng đã tải. Không tìm trong chữ đọc từ ảnh và phần đã ẩn,
 * để ô tìm không dùng được để dò thông tin cá nhân.
 */
function filterHistory(rows, q = "") {
  const needle = unaccent(q).trim();
  if (!needle) return rows;
  return rows.filter((c) =>
    unaccent([c.display_name, maskPii(c.question), c.reply_text, c.image_summary, c.matched_slug].join("\n"))
      .includes(needle));
}

// Số điện thoại (0… hoặc +84…, 10-11 chữ số, cho phép dấu cách/chấm/gạch), CCCD 12 số, email.
const PII_PATTERNS = [
  /[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g,
  /(?<![\d+])(?:\+84|0)(?:[ .-]?\d){9,10}(?!\d)/g,
  /(?<!\d)\d{12}(?!\d)/g,
];

function splitPatterns(text) {
  const ranges = [];
  for (const re of PII_PATTERNS) {
    for (const m of text.matchAll(re)) ranges.push([m.index, m.index + m[0].length]);
  }
  ranges.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
  const out = [];
  let pos = 0;
  for (const [s, e] of ranges) {
    if (s < pos) continue;
    if (s > pos) out.push({ text: text.slice(pos, s), pii: false });
    out.push({ text: text.slice(s, e), pii: true });
    pos = e;
  }
  if (pos < text.length) out.push({ text: text.slice(pos), pii: false });
  return out;
}

/**
 * Tách chữ thành đoạn thường và đoạn thông tin cá nhân: đoạn AI bọc ⟦…⟧ (bỏ dấu bọc;
 * thiếu dấu đóng thì phần còn lại coi là cá nhân), cộng số điện thoại, CCCD, email tự nhận.
 */
function splitPii(text) {
  const s = typeof text === "string" ? text : "";
  const out = [];
  let pos = 0;
  while (pos < s.length) {
    const open = s.indexOf(PII_OPEN, pos);
    if (open < 0) {
      out.push(...splitPatterns(s.slice(pos)));
      break;
    }
    if (open > pos) out.push(...splitPatterns(s.slice(pos, open)));
    const close = s.indexOf(PII_CLOSE, open + 1);
    const end = close < 0 ? s.length : close;
    const inner = s.slice(open + 1, end);
    if (inner) out.push({ text: inner, pii: true });
    pos = close < 0 ? s.length : close + 1;
  }
  return out.filter((p) => p.text);
}

function hasPii(...texts) {
  return texts.some((t) => splitPii(t).some((p) => p.pii));
}

/** Chữ đã ẩn (dùng cho ô tìm và kiểm thử); trang vẫn vẽ từng đoạn để bấm Hiện. */
function maskPii(text) {
  return splitPii(text).map((p) => (p.pii ? PII_MASK : p.text)).join("");
}

/** Bước G2: chỉ dùng link https làm nguồn ảnh. */
function safePhotoUrl(u) {
  if (typeof u !== "string" || u.length > 2000) return null;
  try {
    return new URL(u).protocol === "https:" ? u : null;
  } catch {
    return null;
  }
}

/** Nhãn nút mở: ảnh và/hoặc thông tin cá nhân; null nếu không có gì để ẩn. */
function revealLabel(hasPhoto, hasPiiText) {
  if (hasPhoto && hasPiiText) return "Xem ảnh và thông tin cá nhân";
  if (hasPhoto) return "Xem ảnh";
  if (hasPiiText) return "Hiện thông tin cá nhân";
  return null;
}

function formatBytes(n) {
  if (typeof n !== "number" || !Number.isFinite(n) || n < 0) return "";
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}

const REPLY_MAX_TEXT = 2000;
const REPLY_MAX_NAMES = 5;
const REPLY_MAX_QUOTE_CHARS = 200;
const REPLY_FALLBACK_NAME = "bạn";
/** Ask quá 72 giờ: cảnh báo, mặc định bỏ chọn. */
const ASK_OLD_MS = 72 * 3600 * 1000;
/** Ask còn chờ trả lời: chưa gửi lần nào hoặc lần gửi trước lỗi. */
const ASK_OPEN_STATUSES = ["pending", "failed"];

/*
 * BẢN CHÉP của functions/src/replyMessage.ts (formatAskTime, quoteText, buildReplyMessage).
 * Sửa một bên thì sửa cả bên kia; cả hai chạy bộ mẫu functions/test/fixtures/reply-message.json,
 * để xem trước khớp 100% tin gửi đi.
 */
function replyFormatTime(ms) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: TIMEZONE, hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date(ms));
  const p = (t) => parts.find((x) => x.type === t)?.value ?? "";
  return `${p("hour")}:${p("minute")} ${p("day")}/${p("month")}`;
}

function replyQuote(ask) {
  const q = (ask.question ?? "").replace(/\s+/g, " ").trim();
  if (!q) return ask.source === "image" ? "[Ảnh]" : "(không có nội dung)";
  const chars = Array.from(q);
  return chars.length <= REPLY_MAX_QUOTE_CHARS ? q : chars.slice(0, REPLY_MAX_QUOTE_CHARS).join("") + "…";
}

function buildReplyMessage(asks, answerText) {
  const answer = (answerText ?? "").trim();
  const sorted = asks
    .map((a, i) => ({ a, i }))
    .sort((x, y) => (x.a.askedAtMs ?? 0) - (y.a.askedAtMs ?? 0) || x.i - y.i)
    .map((x) => x.a);
  const latest = sorted[sorted.length - 1];
  const names = [];
  const seen = new Set();
  for (const a of sorted) {
    const name = (a.displayName ?? "").trim() || REPLY_FALLBACK_NAME;
    const key = a.fromId ? `id:${a.fromId}` : `name:${name}`;
    if (seen.has(key)) continue;
    seen.add(key);
    names.push(name);
  }
  let header;
  if (names.length <= 1) {
    const at = latest && typeof latest.askedAtMs === "number" ? ` (${replyFormatTime(latest.askedAtMs)})` : "";
    header = `📌 Trả lời câu hỏi của ${names[0] ?? REPLY_FALLBACK_NAME}${at}:`;
  } else {
    const shown = names.slice(0, REPLY_MAX_NAMES).join(", ");
    const more = names.length > REPLY_MAX_NAMES ? ` và ${names.length - REPLY_MAX_NAMES} người khác` : "";
    header = `📌 Trả lời câu hỏi của ${shown}${more}:`;
  }
  const quote = latest ? `"${replyQuote(latest)}"` : "";
  return `${header}\n${quote}\n\n${answer}`;
}
/* Hết bản chép. */

/** Tài liệu `unanswered/{id}/asks/{askId}` → dạng dùng cho trang. `asked_at` là Timestamp (có toMillis). */
function askFromDoc(id, d) {
  const s = (v) => (typeof v === "string" ? v : null);
  const ms = d?.asked_at && typeof d.asked_at.toMillis === "function" ? d.asked_at.toMillis() : null;
  return {
    id,
    chatId: s(d?.chat_id) || null,
    chatType: s(d?.chat_type),
    fromId: s(d?.from_id),
    displayName: s(d?.display_name),
    question: s(d?.question) ?? "",
    askedAtMs: ms,
    source: s(d?.source),
    status: s(d?.reply_status) ?? "pending",
    error: s(d?.reply_error),
  };
}

/** "zgr-ABCDEF…1234" cho mã dài. */
function shortChatId(id) {
  const s = String(id ?? "");
  return s.length > 14 ? `${s.slice(0, 8)}…${s.slice(-4)}` : s;
}

/** Tên hiển thị của nhóm/chat: nhãn ở Cài đặt, không có thì "Chat riêng" hoặc mã rút gọn. */
function chatDisplayName(chatId, chatType, labels = {}) {
  if (!chatId) return "(không có mã nhóm)";
  if (labels[chatId]) return labels[chatId];
  if (chatType && chatType !== "GROUP") return "Chat riêng";
  return `Nhóm ${shortChatId(chatId)}`;
}

/** "N người hỏi · M nhóm" cho các ask còn chờ. Người tính theo from_id (thiếu thì theo tên). */
function askSummary(asks) {
  const open = asks.filter((a) => ASK_OPEN_STATUSES.includes(a.status));
  const people = new Set(open.map((a) => (a.fromId ? `id:${a.fromId}` : `name:${a.displayName ?? ""}`)));
  const chats = new Set(open.map((a) => a.chatId ?? `x:${a.id}`));
  return { asks: open.length, people: people.size, chats: chats.size };
}

/** Cảnh báo cho một ask và có chọn sẵn hay không (mục 6.2). */
function askFlags(ask, { nowMs, allowedChatIds = [] }) {
  const ageMs = typeof ask.askedAtMs === "number" ? nowMs - ask.askedAtMs : null;
  const oldDays = ageMs !== null && ageMs > ASK_OLD_MS ? Math.floor(ageMs / 86400000) : null;
  const notAllowed = !!ask.chatId && (!ask.chatType || ask.chatType === "GROUP") && !allowedChatIds.includes(ask.chatId);
  const noChat = !ask.chatId;
  return { oldDays, notAllowed, noChat, preselect: oldDays === null && !notAllowed && !noChat };
}

/** Gom ask theo chat_id, giữ thứ tự lượt hỏi đầu tiên của mỗi nhóm. Ask thiếu chat_id: mỗi ask một nhóm. */
function groupAsksByChat(asks) {
  const sorted = [...asks].sort((a, b) => (a.askedAtMs ?? 0) - (b.askedAtMs ?? 0));
  const groups = new Map();
  for (const a of sorted) {
    const key = a.chatId ? `c:${a.chatId}` : `x:${a.id}`;
    if (!groups.has(key)) groups.set(key, { chatId: a.chatId, chatType: a.chatType, asks: [] });
    groups.get(key).asks.push(a);
  }
  return [...groups.values()];
}

/** Tin sẽ gửi cho từng nhóm, độ dài tin dài nhất, có vượt 2.000 ký tự không. */
function replyPlan(selectedAsks, answerText) {
  const groups = groupAsksByChat(selectedAsks).map((g) => {
    const text = buildReplyMessage(g.asks, answerText);
    return { ...g, text, length: charLength(text) };
  });
  const maxLength = groups.reduce((m, g) => Math.max(m, g.length), 0);
  return { groups, maxLength, over: maxLength > REPLY_MAX_TEXT, sendable: groups.filter((g) => g.chatId).length };
}

/** Phần gửi đi mặc định khi có mục kho: nội dung trả lời và các link, như bot gửi (không gồm ảnh). */
function defaultReplyAnswer(item) {
  const answer = cleanText(item?.answer);
  const links = (Array.isArray(item?.links) ? item.links : [])
    .filter((l) => l && typeof l.url === "string" && l.url.startsWith("https://"))
    .map((l) => `${cleanText(l.label) || "Liên kết"}: ${l.url}`);
  return links.length ? `${answer}\n\n${links.join("\n")}` : answer;
}

/** Nhãn trạng thái của một nhóm trong kết quả gửi. */

/** Tạo phần tử. Chuỗi luôn đi qua textContent (không dùng innerHTML: câu hỏi đến từ người dùng Zalo). */
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

  show(h("div", { class: "center muted" }, "Đang tải…"));
  try {
    if (tab === "unanswered") await renderUnanswered();
    else if (tab === "history") await renderHistory();
    else if (tab === "kb") await renderKb();
    else if (tab === "stats") await renderStats();
    else await renderSettings();
  } catch (e) {
    console.error(e);
    show(msg("bad", errText(e)));
  }
}

async function emulatorLogin() {
  const cred = GoogleAuthProvider.credential(
    JSON.stringify({ sub: "emulator-admin", email: "admin@example.com", email_verified: true }));
  try {
    await signInWithCredential(auth, cred);

async function login() {
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e?.code === "auth/popup-blocked" || e?.code === "auth/operation-not-supported-in-this-environment") {
      await signInWithRedirect(auth, provider);
    } else if (e?.code !== "auth/popup-closed-by-user" && e?.code !== "auth/cancelled-popup-request") {
      renderLogin(errText(e));
    }
  }
}

// ---------- Màn: Lịch sử hỗ trợ (bước G) ----------
// Chỉ đọc conversations; không sửa, không xóa. Thông tin cá nhân ẩn mặc định, bấm "Hiện" thì ghi pii_views.
// Số dòng mỗi trang nhớ riêng từng danh sách trên máy này (lỗi bộ nhớ trình duyệt thì dùng 10).
function savedPageSize(key) {
  try {
    return pageSize(localStorage.getItem(`page_size_${key}`));
  } catch {
    return PAGE_SIZES[0];
  }
}
function savePageSize(key, size) {
  try {
    localStorage.setItem(`page_size_${key}`, String(size));
  } catch { /* bỏ qua */ }
}

/**
 * Thanh phân trang: "Dòng 1–10 / 37", nút Trước / số trang / Sau, chọn 10/20/50 dòng.
 * hasMore: còn dữ liệu chưa tải từ Firestore (bấm Sau ở trang cuối sẽ tải thêm).
 */
function pager({ slice, hasMore = false, size, onPage, onSize }) {
  const { page, pages, total, from, to } = slice;
  if (!total && !hasMore) return null;
  const btn = (label, target, on = false, disabled = false) =>
    h("button", { class: `btn${on ? " on" : ""}`, disabled, onclick: () => onPage(target) }, label);
  const sizeSel = h("select", { "aria-label": "Số dòng mỗi trang", onchange: (e) => onSize(pageSize(e.target.value)) },
    PAGE_SIZES.map((n) => h("option", { value: n }, `${n} dòng/trang`)));
  sizeSel.value = String(size);
  return h("div", { class: "pager" },
    h("span", { class: "muted" }, `Dòng ${fmtNum.format(from)}–${fmtNum.format(to)} / ${fmtNum.format(total)}${hasMore ? "+" : ""}`),
    h("div", { class: "pages" },
      btn("‹ Trước", page - 1, false, page <= 1),
      pageNumbers(page, pages).map((n) => (n === null ? h("span", { class: "muted" }, "…") : btn(String(n), n, n === page))),
      hasMore ? h("span", { class: "muted" }, "…") : null,
      btn("Sau ›", page + 1, false, page >= pages && !hasMore),
    ),
    sizeSel,
  );
}

const hist = { kind: "all", range: "7", chatId: "", q: "", rows: [], last: null, done: false, labels: {}, chats: [],
  open: new Set(), revealed: new Set(), error: null, page: 1, size: savedPageSize("history") };

function historyQuery(after) {
  const ors = historyClauses(hist.kind).map(([f, v]) => where(f, "in", v));
  const conds = [where("created_at", ">=", historySince(hist.range))];
  if (hist.chatId) conds.push(where("chat_id", "==", hist.chatId));
  conds.push(ors.length > 1 ? or(...ors) : ors[0]);
  const parts = [orderBy("created_at", "desc"), limit(HISTORY_PAGE_SIZE)];
  if (after) parts.splice(1, 0, startAfter(after));
  return query(collection(db, "conversations"), and(...conds), ...parts);
}

async function loadHistory(more = false) {
  if (!more) {
    hist.rows = [];
    hist.last = null;
    hist.done = false;
  }
  const snap = await getDocs(historyQuery(more ? hist.last : null));
  hist.rows.push(...snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((c) => matchesKind(c, hist.kind)));
  hist.last = snap.docs.at(-1) ?? hist.last;
  hist.done = snap.size < HISTORY_PAGE_SIZE;
}

async function renderHistory(notice) {
  const [cfg] = await Promise.all([getDoc(doc(db, "config", "main")).catch(() => null), loadKb()]);
  const s = settingsFromConfig(cfg?.exists() ? cfg.data() : {});
  hist.chats = s.chats;
  hist.labels = Object.fromEntries(s.chats.map((c) => [c.id, c.label || c.id]));
  hist.revealed.clear();
  hist.open.clear();
  hist.q = "";
  hist.page = 1;
  hist.error = null;
  try {
    await loadHistory();
  } catch (e) {
    console.error(e);
    hist.error = errText(e);
  }
  drawHistory(notice);
}

function drawHistory(notice) {
  const sel = (value, options, onchange) => {
    const el = h("select", { onchange: (e) => onchange(e.target.value), style: "width:auto" },
      options.map(([v, label]) => h("option", { value: v }, label)));
    el.value = value;
    return el;
  };
  const reload = async () => {
    show(h("div", { class: "center muted" }, "Đang tải…"));
    hist.error = null;
    hist.page = 1;
    try {
      await loadHistory();
    } catch (e) {
      console.error(e);
      hist.error = errText(e);
    }
    drawHistory();
  };
  const search = h("input", { type: "search", placeholder: "Tìm trong các dòng đã tải…", value: hist.q, class: "grow" });
  const listBox = h("div");
  const summaryBox = h("p", { class: "muted" });
  let busy = false;
  const goPage = async (n) => {
    if (busy) return;
    const rows = filterHistory(hist.rows, hist.q);
    // Trang chưa tải: lấy thêm từ Firestore (mỗi lần 50 dòng) cho đến khi đủ hoặc hết.
    if (n > Math.ceil(rows.length / hist.size) && !hist.done && !hist.error) {
      busy = true;
      try {
        while (!hist.done && filterHistory(hist.rows, hist.q).length < (n - 1) * hist.size + 1) await loadHistory(true);
      } catch (err) {
        alert(errText(err));
      }
      busy = false;
    }
    hist.page = n;
    paint();
    summaryBox.scrollIntoView({ block: "nearest" });
  };
  const paint = () => {
    const rows = filterHistory(hist.rows, hist.q);
    const t = historySummary(rows);
    summaryBox.textContent = `${fmtNum.format(t.total)} lần hỗ trợ${hist.done ? "" : " (đã tải " +
      fmtNum.format(hist.rows.length) + ", còn nữa)"}: ${t.answered} trả lời được, ${t.handoff} chuyển ca, ` +
      `${t.error} lỗi, ${t.silent} bot không trả lời; ${t.image} tin ảnh.`;
    const slice = pageSlice(rows, hist.page, hist.size);
    hist.page = slice.page;
    listBox.replaceChildren(...nodes(
      slice.items.length ? slice.items.map(historyCard) : h("div", { class: "card center muted" }, "Không có lần hỗ trợ nào."),
      pager({
        slice, hasMore: !hist.done && !hist.error, size: hist.size, onPage: goPage,
        onSize: (size) => {
          hist.size = size;
          savePageSize("history", size);
          goPage(1);
        },
      }),
    ));
  };
  search.addEventListener("input", () => {
    hist.q = search.value;
    hist.page = 1;
    paint();
  });
  show(
    notice ?? null,
    hist.error ? msg("bad", hist.error) : null,
    h("div", { class: "card" },
      h("div", { class: "row" },
        sel(hist.kind, HISTORY_KINDS, (v) => ((hist.kind = v), reload())),
        sel(hist.range, HISTORY_RANGES, (v) => ((hist.range = v), reload())),
        sel(hist.chatId, [["", "Mọi nhóm"], ...hist.chats.map((c) => [c.id, c.label || c.id])],
          (v) => ((hist.chatId = v), reload())),
        search,
      ),
      h("p", { class: "muted", style: "margin:8px 0 0" },
        "Chỉ hiện tin có gọi tên bot. Nhật ký giữ 90 ngày. Thông tin cá nhân (tên, số điện thoại, CCCD, mã hồ sơ, ",
        "địa chỉ…) ẩn mặc định; mỗi lần bấm Hiện được ghi lại."),
    ),
    summaryBox,
    listBox,
    piiViewsCard(),
  );
  paint();
}

/** Vẽ chữ có thông tin cá nhân: mặc định thành [đã ẩn]. */
function piiText(text, revealed) {
  return splitPii(text).map((p) => (p.pii
    ? h("mark", { class: "pii", title: revealed ? "Thông tin cá nhân" : "Đã ẩn thông tin cá nhân" },
      revealed ? p.text : PII_MASK)
    : p.text));
}

function historyCard(c) {
  const st = historyStatus(c);
  const isOpen = hist.open.has(c.id);
  const revealed = hist.revealed.has(c.id);
  const item = c.matched_slug ? state.kb.get(c.matched_slug) : null;
  const isImage = c.source === "image";
  const piiHere = hasPii(c.question, c.image_text);
  const photo = isImage ? safePhotoUrl(c.photo_url) : null;
  const openLabel = revealLabel(!!photo, piiHere);
  const toggle = () => {
    if (isOpen) hist.open.delete(c.id);
    else hist.open.add(c.id);
    card.replaceWith(historyCard(c));
  };
  const reveal = async (e) => {
    e.stopPropagation();
    e.target.disabled = true;
    try {
      await addDoc(collection(db, "pii_views"), {
        conversation_id: c.id, viewed_by: state.user.email, viewed_at: serverTimestamp(),
      });
      hist.revealed.add(c.id);
      hist.open.add(c.id);
      card.replaceWith(historyCard(c));
    } catch (err) {
      e.target.disabled = false;
      alert(errText(err));
    }
  };
  const hide = (e) => {
    e.stopPropagation();
    hist.revealed.delete(c.id);
    card.replaceWith(historyCard(c));
  };
  const meta = (label, value) => (value === null || value === undefined || value === ""
    ? null
    : h("div", { class: "kv" }, h("span", { class: "muted" }, label), h("span", {}, value)));
  const reasonText = c.outcome === "ignored"
    ? SILENT_LABELS[c.ignore_reason] ?? c.ignore_reason
    : c.reason ? REASON_LABELS[c.reason] ?? c.reason : null;

  const card = h("div", { class: "card hist" },
    h("div", { class: "row clickable", onclick: toggle, role: "button", tabindex: 0,
      onkeydown: (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), toggle()) },
      h("span", { class: `chip st-${st.cls}` }, st.label),
      isImage ? h("span", { class: "chip", title: "Người dùng gửi ảnh" }, "Ảnh") : null,
      h("span", { class: "muted" }, when(c.created_at)),
      h("span", { class: "muted" }, hist.labels[c.chat_id] ?? "Nhóm khác"),
      h("span", { class: "muted" }, c.display_name || "(không tên)"),
      h("span", { class: "muted", style: "margin-left:auto" }, isOpen ? "Thu gọn ▴" : "Chi tiết ▾"),
    ),
    h("p", { class: "sample", style: "margin:6px 0 0" },
      c.question ? ["“", piiText(c.question, revealed), "”"] : h("span", { class: "muted" }, "(không có chữ)")),
    h("p", { class: "muted", style: "margin:4px 0 0" }, [
      item || c.matched_slug ? `Mục: ${item?.title ?? c.matched_slug}` : "",
      typeof c.confidence === "number" ? `độ tin cậy ${c.confidence.toFixed(2)}` : "",
      reasonText ? `Lý do: ${reasonText}` : "",
      isImage && c.image_summary ? `Ảnh: ${c.image_summary}` : "",
    ].filter(Boolean).join(" · ")),
    isOpen ? h("div", { class: "histd" },
      openLabel ? h("div", { class: "row", style: "justify-content:flex-end" },
        revealed
          ? h("button", { class: "btn", onclick: hide }, photo ? "Ẩn lại" : "Ẩn thông tin cá nhân")
          : h("button", { class: "btn", onclick: reveal }, openLabel)) : null,
      h("section", {},
        h("h4", {}, "Người dùng đã nhắn"),
        meta("Người gửi", c.display_name || "(không tên)"),
        meta("Nhóm", hist.labels[c.chat_id] ?? "Nhóm khác"),
        meta("Thời gian", when(c.created_at)),
        meta("Loại tin", isImage ? "Ảnh kèm chú thích" : "Chữ"),
        h("div", { class: "quote" }, c.question ? piiText(c.question, revealed) : h("span", { class: "muted" }, "(trống)")),
      ),
      isImage ? h("section", {},
        h("h4", {}, "Thông tin đọc từ ảnh"),
        meta("Mô tả", c.image_summary || "(không có)"),
        meta("Ảnh", [c.image_type, formatBytes(c.image_bytes)].filter(Boolean).join(", ") || null),
        photoBox(photo, revealed, reveal, c),
        c.image_text
          ? h("div", { class: "quote" }, piiText(c.image_text, revealed))
          : h("p", { class: "muted" }, c.reason === "image_fetch_error"
            ? "Bot không tải được ảnh nên không đọc được."
            : "Không có chữ đọc từ ảnh (ảnh gửi trước bước G, đang tắt chép chữ, hoặc ảnh không có chữ)."),
      ) : null,
      h("section", {},
        h("h4", {}, "Bot đã hỗ trợ"),
        meta("Kết quả", st.label),
        meta("Mục đã chọn", item || c.matched_slug ? `${item?.title ?? "(mục đã xóa)"} (${c.matched_slug})` : null),
        meta("Độ tin cậy", typeof c.confidence === "number" ? c.confidence.toFixed(2) : null),
        meta("Lý do", reasonText),
        meta("Ảnh gửi kèm", typeof c.images_sent === "number"
          ? `${c.images_sent} ảnh${c.images_as_links ? `, ${c.images_as_links} thành link` : ""}` +
            `${c.image_errors ? `, ${c.image_errors} lỗi` : ""}`
          : null),
        meta("Lỗi", c.error),
        meta("Thời gian xử lý", [
          typeof c.duration_ms === "number" ? `tổng ${fmtNum.format(c.duration_ms)} ms` : "",
          typeof c.ai_ms === "number" ? `AI ${fmtNum.format(c.ai_ms)} ms` : "",
          typeof c.fetch_ms === "number" ? `tải ảnh ${fmtNum.format(c.fetch_ms)} ms` : "",
        ].filter(Boolean).join(", ") || null),
        c.reply_text
          ? h("div", { class: "quote" }, c.reply_text)
          : h("p", { class: "muted" }, "Bot không gửi tin nào."),
        item ? h("div", { class: "actions" },
          h("button", { class: "btn", onclick: () => itemEditor({
            slug: c.matched_slug, form: itemToForm(c.matched_slug, item), onDone: () => go("history"),
          }) }, "Mở mục")) : null,
      ),
    ) : null,
  );
  return card;
}

/** Ảnh gốc từ link Zalo: mờ đến khi bấm Xem ảnh (ghi pii_views); link hỏng thì báo. */
